<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Wizard of Wor</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; background:#000; overflow:hidden;
    touch-action:none; -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;
    font-family:'Press Start 2P', monospace; color:#fff;
  }
  #gameContainer { position:fixed; inset:0; width:100vw; height:100vh; overflow:hidden; }
  #phaserWrap { width:100%; height:100%; position:relative; z-index:1; }
  #phaserWrap canvas {
    position:fixed !important; top:0; left:0;
    width:100vw !important; height:100vh !important;
    z-index:0 !important; pointer-events:none !important;
  }
  #gameInputLayer { position:absolute; inset:0; z-index:2; pointer-events:auto; }

  #hud {
    position:absolute; top:0; left:0; right:0; height:42px;
    display:flex; justify-content:space-between; align-items:center;
    padding:0 12px; z-index:5; pointer-events:none;
    background:linear-gradient(to bottom, rgba(0,0,0,0.85), rgba(0,0,0,0));
    font-size:11px; color:#ffea00; text-shadow:1px 1px 0 #000;
  }
  #hud .stat { padding:0 6px; }
  #hud .stat .v { color:#fff; }

  .overlay {
    position:absolute; inset:0; z-index:10;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(0,0,0,0.85); padding:20px; text-align:center; gap:18px;
  }
  .overlay h1 {
    font-size:24px; color:#ff3366; text-shadow:2px 2px 0 #000, 0 0 16px #ff0044;
    line-height:1.4;
  }
  .overlay h2 { font-size:16px; color:#ffea00; text-shadow:2px 2px 0 #000; }
  .overlay p { font-size:9px; line-height:1.7; color:#aaffcc; max-width:340px; }
  .overlay .legend { font-size:8px; line-height:1.8; color:#fff; text-align:left; }
  .overlay .legend span { display:inline-block; width:10px; height:10px; margin-right:6px; vertical-align:middle; border:1px solid #fff; }

  .btn {
    background:#222; color:#0ff; border:2px solid #0ff;
    padding:14px 24px; font-family:inherit; font-size:12px;
    cursor:pointer; pointer-events:auto;
    text-shadow:1px 1px 0 #000; box-shadow:0 0 12px #0ff;
  }
  .btn:active { background:#0ff; color:#000; }
  .hidden { display:none !important; }

  /* === NEW TRANSLUCENT CONTROLS === */
  #controls {
    position:absolute; bottom:0; left:0; right:0;
    height:140px; z-index:6; pointer-events:none;
    display:flex; justify-content:space-between; align-items:flex-end;
    padding:12px 20px 20px;
  }

  /* D-Pad (bottom left) */
  #dpad {
    position:relative; width:120px; height:120px;
    pointer-events:auto; opacity:0.35;
  }
  .dpad-btn {
    position:absolute; width:38px; height:38px;
    background:rgba(255,255,255,0.2); border:2px solid #0ff;
    border-radius:6px; display:flex; align-items:center; justify-content:center;
    font-size:18px; color:#0ff; user-select:none; touch-action:none;
    box-shadow:0 0 8px rgba(0,255,255,0.4);
  }
  .dpad-btn:active { background:rgba(0,255,255,0.4); color:#000; }
  #dpad-up    { top:0; left:42px; }
  #dpad-down  { bottom:0; left:42px; }
  #dpad-left  { top:42px; left:0; }
  #dpad-right { top:42px; right:0; }

  /* Fire button (bottom right) */
  #fireBtn {
    width:92px; height:92px; border-radius:50%;
    background:rgba(255,80,80,0.25); border:3px solid #ff4444;
    display:flex; align-items:center; justify-content:center;
    font-size:16px; color:#ff6666; font-weight:bold;
    pointer-events:auto; opacity:0.4; box-shadow:0 0 20px rgba(255,0,0,0.5);
    user-select:none; touch-action:none;
  }
  #fireBtn:active {
    background:rgba(255,80,80,0.6); color:#fff; transform:scale(0.95);
  }

  #touchHint { display:none; } /* hide old hint */
</style>
</head>
<body>
<div id="gameContainer">
  <div id="phaserWrap"></div>
  <div id="gameInputLayer"></div>

  <div id="hud">
    <div class="stat">SCORE <span class="v" id="score">0</span></div>
    <div class="stat">DUNGEON <span class="v" id="level">1</span></div>
    <div class="stat">LIVES <span class="v" id="lives">3</span></div>
  </div>

  <!-- NEW ON-SCREEN CONTROLS -->
  <div id="controls">
    <!-- D-Pad -->
    <div id="dpad">
      <div id="dpad-up"    class="dpad-btn">▲</div>
      <div id="dpad-down"  class="dpad-btn">▼</div>
      <div id="dpad-left"  class="dpad-btn">◀</div>
      <div id="dpad-right" class="dpad-btn">▶</div>
    </div>

    <!-- Fire Button -->
    <div id="fireBtn">FIRE</div>
  </div>

  <div id="startScreen" class="overlay">
    <h1>WIZARD<br>OF WOR</h1>
    <div class="legend">
      <div><span style="background:#22dd33"></span>BURWOR — 100 pts</div>
      <div><span style="background:#dd3322"></span>GARWOR — 200 pts (fades)</div>
      <div><span style="background:#3366ff"></span>THORWOR — 500 pts (invisible)</div>
      <div><span style="background:#ff8800"></span>WORLUK — 1000 pts (escapes)</div>
      <div><span style="background:#aa44ff"></span>WIZARD — 2500 pts (teleports)</div>
    </div>
    <p>Watch the RADAR for invisible enemies!<br>Use the WARP tunnels on the sides.</p>
    <button class="btn" id="startBtn">START</button>
  </div>

  <div id="gameOverScreen" class="overlay hidden">
    <h1>GAME OVER</h1>
    <h2 id="finalScore">SCORE: 0</h2>
    <button class="btn" id="restartBtn">PLAY AGAIN</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<script>
// ============================================================
// WIZARD OF WOR — Enhanced with Sound + On-Screen Controls
// ============================================================
const COLS = 22;
const ROWS = 14;
const CELL = 48;
const MAZE_W = COLS * CELL;
const MAZE_H = ROWS * CELL;
const RADAR_H = 80;
const GAME_W = MAZE_W;
const GAME_H = MAZE_H + RADAR_H;

const DIR = { NONE:0, LEFT:1, RIGHT:2, UP:3, DOWN:4 };
const DVEC = {
  [DIR.LEFT]:  { x:-1, y:0 },
  [DIR.RIGHT]: { x:1,  y:0 },
  [DIR.UP]:    { x:0,  y:-1 },
  [DIR.DOWN]:  { x:0,  y:1 },
  [DIR.NONE]:  { x:0,  y:0 },
};

// Web Audio Context
let audioCtx;
function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playShootSound() {
  const ctx = getAudio();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  const filter = ctx.createBiquadFilter();

  osc.type = 'sawtooth';
  osc.frequency.value = 880;
  filter.type = 'lowpass';
  filter.frequency.value = 2200;

  gain.gain.value = 0.25;
  gain.gain.linearRampToValueAtTime(0.001, ctx.currentTime + 0.18);

  osc.connect(filter);
  filter.connect(gain);
  gain.connect(ctx.destination);

  osc.start();
  osc.stop(ctx.currentTime + 0.2);
}

function playExplosionSound() {
  const ctx = getAudio();

  // Low boom
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.value = 90;
  gain.gain.value = 0.6;
  gain.gain.linearRampToValueAtTime(0.001, ctx.currentTime + 0.6);

  // Noise burst
  const noise = ctx.createBufferSource();
  const buffer = ctx.createBuffer(1, ctx.sampleRate * 0.6, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  noise.buffer = buffer;

  const noiseFilter = ctx.createBiquadFilter();
  noiseFilter.type = 'lowpass';
  noiseFilter.frequency.value = 800;

  const noiseGain = ctx.createGain();
  noiseGain.gain.value = 0.7;
  noiseGain.gain.linearRampToValueAtTime(0.001, ctx.currentTime + 0.55);

  osc.connect(gain);
  gain.connect(ctx.destination);

  noise.connect(noiseFilter);
  noiseFilter.connect(noiseGain);
  noiseGain.connect(ctx.destination);

  osc.start();
  noise.start();
  osc.stop(ctx.currentTime + 0.65);
  noise.stop(ctx.currentTime + 0.65);
}

// ----------------------------------------------------------
// Maze generator
// ----------------------------------------------------------
function generateMaze(level) {
  const g = [];
  for (let r = 0; r < ROWS; r++) {
    g.push([]);
    for (let c = 0; c < COLS; c++) g[r].push(0);
  }
  for (let c = 0; c < COLS; c++) { g[0][c] = 1; g[ROWS-1][c] = 1; }
  for (let r = 0; r < ROWS; r++) { g[r][0] = 1; g[r][COLS-1] = 1; }

  const warpRows = [(ROWS/2 - 1)|0, (ROWS/2)|0];
  warpRows.forEach(r => { g[r][0] = 0; g[r][COLS-1] = 0; });

  let seed = level * 7919 + 13;
  function rnd() { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }

  const halfC = (COLS / 2) | 0;
  for (let r = 2; r < ROWS-2; r += 2) {
    for (let c = 2; c < halfC; c += 2) {
      const k = rnd();
      if (k < 0.45) {
        const len = (rnd() < 0.5) ? 1 : 2;
        for (let i = 0; i < len && r+i < ROWS-2; i++) {
          g[r+i][c] = 1; g[r+i][COLS-1-c] = 1;
        }
      } else if (k < 0.7) {
        g[r][c] = 1; g[r][c+1] = 1; g[r][COLS-1-c] = 1; g[r][COLS-2-c] = 1;
      }
    }
  }

  for (let r = 1; r < ROWS-1; r++) {
    for (let c = 1; c < COLS-1; c++) {
      if (g[r][c] && g[r+1][c] && g[r][c+1] && g[r+1][c+1]) {
        g[r+1][c+1] = 0; g[ROWS-2-r][COLS-2-c] = 0;
      }
    }
  }

  const midR = (ROWS/2) | 0;
  for (let c = 1; c < COLS-1; c++) g[midR][c] = 0;

  const spawns = [[midR,2],[midR,COLS-3],[2,halfC-1],[2,halfC],[ROWS-3,halfC-1],[ROWS-3,halfC],[midR-1,halfC],[midR+1,halfC]];
  spawns.forEach(([r,c]) => { if (g[r] && g[r][c]!==undefined) g[r][c]=0; });

  return g;
}

// ----------------------------------------------------------
// Phaser Scene
// ----------------------------------------------------------
class GameScene extends Phaser.Scene {
  constructor() { super('game'); }

  create() {
    window._gameScene = this;
    this.cameras.main.setBackgroundColor('#000');

    this.createTextures();

    this.score = 0; this.lives = 3; this.level = 1;
    this.state = 'idle';
    this.bullets = []; this.enemyBullets = [];
    this.player = null; this.enemies = [];
    this.maze = null;

    this.mazeGfx = this.add.graphics();
    this.entityLayer = this.add.container(0, 0);
    this.radarGfx = this.add.graphics();

    this.cursors = this.input.keyboard.createCursorKeys();
    this.spaceKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);
    this.spaceKey.on('down', () => this.tryFire());

    this.touchDir = DIR.NONE;
    this.queuedDir = DIR.NONE;

    this.updateHUD();
  }

  createTextures() {
    const g = this.make.graphics({ x:0, y:0, add:false });

    function makeCreature(key, body, eye, glow) {
      g.clear();
      g.fillStyle(glow, 0.25); g.fillCircle(20, 20, 19);
      g.fillStyle(body, 1); g.fillRoundedRect(4, 6, 32, 30, 6);
      g.fillStyle(body, 1);
      g.fillRect(6,34,6,6); g.fillRect(16,34,6,6); g.fillRect(26,34,6,6);
      g.fillStyle(0xffffff,1); g.fillRect(11,14,7,7); g.fillRect(22,14,7,7);
      g.fillStyle(eye,1); g.fillRect(13,16,4,4); g.fillRect(24,16,4,4);
      g.fillStyle(0xffffff,1);
      g.fillTriangle(14,26,18,26,16,30); g.fillTriangle(22,26,26,26,24,30);
      g.generateTexture(key,40,40);
    }

    makeCreature('burwor', 0x22dd33, 0xff0000, 0x88ff66);
    makeCreature('garwor', 0xdd3322, 0xffff00, 0xff8866);
    makeCreature('thorwor', 0x3366ff, 0xffffff, 0x88aaff);
    makeCreature('worluk', 0xff8800, 0xffffff, 0xffdd66);

    g.clear();
    g.fillStyle(0xaa44ff,0.3); g.fillCircle(20,20,19);
    g.fillStyle(0xaa44ff,1); g.fillTriangle(20,0,6,18,34,18);
    g.fillStyle(0xffccaa,1); g.fillCircle(20,24,8);
    g.fillStyle(0x000000,1); g.fillRect(15,22,3,3); g.fillRect(22,22,3,3);
    g.fillStyle(0xffffff,1); g.fillRect(8,30,24,8);
    g.fillStyle(0xffea00,1); g.fillCircle(8,20,3); g.fillCircle(32,20,3);
    g.generateTexture('wizard',40,40);

    g.clear();
    g.fillStyle(0xffea00,0.3); g.fillCircle(20,20,19);
    g.fillStyle(0xffea00,1); g.fillRoundedRect(6,8,28,26,5);
    g.fillStyle(0x000000,1); g.fillRect(12,14,5,5); g.fillRect(23,14,5,5);
    g.fillStyle(0xff0000,1); g.fillRect(14,24,12,4);
    g.fillStyle(0xffea00,1); g.fillRect(8,32,6,6); g.fillRect(26,32,6,6);
    g.generateTexture('player',40,40);

    g.clear(); g.fillStyle(0xffffff,1); g.fillRect(0,2,12,4); g.fillStyle(0xffea00,1); g.fillRect(2,1,8,6);
    g.generateTexture('bullet',12,8);
    g.clear(); g.fillStyle(0xff4488,1); g.fillRect(0,2,12,4); g.fillStyle(0xffaaaa,1); g.fillRect(2,1,8,6);
    g.generateTexture('ebullet',12,8);

    g.destroy();
  }

  updateHUD() {
    document.getElementById('score').textContent = this.score;
    document.getElementById('lives').textContent = this.lives;
    document.getElementById('level').textContent = this.level;
  }

  _begin() {
    document.getElementById('startScreen').classList.add('hidden');
    document.getElementById('gameOverScreen').classList.add('hidden');
    this.score = 0; this.lives = 3; this.level = 1;
    this.updateHUD();
    this.startLevel();
  }

  startLevel() {
    this.clearAll();
    this.maze = generateMaze(this.level);
    this.drawMaze();

    const midR = (ROWS/2)|0;
    const px = ((COLS/2)|0)*CELL + CELL/2;
    const py = (ROWS-3)*CELL + CELL/2;
    this.player = this.spawnEntity('player', px, py, {
      type:'player', speed:120, dir:DIR.NONE, alive:true,
    });

    const enemyCount = Math.min(6 + this.level, 10);
    const types = [];
    for (let i=0; i<enemyCount; i++) {
      const r = Math.random();
      if (this.level >= 3 && r < 0.2) types.push('thorwor');
      else if (this.level >= 2 && r < 0.45) types.push('garwor');
      else types.push('burwor');
    }

    const spawnPts = [[2,2],[2,6],[2,10],[2,14],[2,18],[4,4],[4,18],[midR,2],[midR,COLS-3]];
    types.forEach((t,i) => {
      const sp = spawnPts[i % spawnPts.length];
      this.spawnEnemy(t, sp[1]*CELL+CELL/2, sp[0]*CELL+CELL/2);
    });

    this.worlukSpawned = false; this.wizardSpawned = false;
    this.state = 'playing';
  }

  spawnEntity(key, x, y, props) {
    const img = this.add.image(x, y, key);
    img.setDisplaySize(CELL-6, CELL-6);
    Object.assign(img, props);
    img.gridCol = Math.floor(x/CELL); img.gridRow = Math.floor(y/CELL);
    img.moveCooldown = 0;
    this.entityLayer.add(img);
    return img;
  }

  spawnEnemy(type, x, y) {
    const cfg = {
      burwor:  { speed:55,  visible:1.0, points:100 },
      garwor:  { speed:75,  visible:0.6, points:200, fades:true },
      thorwor: { speed:95,  visible:0.0, points:500, invisible:true },
      worluk:  { speed:140, visible:1.0, points:1000, flees:true },
      wizard:  { speed:90,  visible:1.0, points:2500, teleports:true },
    }[type];

    const e = this.spawnEntity(type, x, y, {
      type, alive:true,
      dir: Phaser.Math.RND.pick([DIR.LEFT,DIR.RIGHT,DIR.UP,DIR.DOWN]),
      speed: cfg.speed, points: cfg.points,
      fades: cfg.fades||false, invisible: cfg.invisible||false,
      flees: cfg.flees||false, teleports: cfg.teleports||false,
      fireTimer: Phaser.Math.Between(2000,6000),
      teleportTimer: type==='wizard' ? Phaser.Math.Between(3000,5000) : 0,
    });
    if (cfg.invisible) e.setAlpha(0);
    else if (cfg.fades) e.setAlpha(cfg.visible);
    this.enemies.push(e);
    return e;
  }

  clearAll() {
    this.entityLayer.removeAll(true);
    this.bullets = []; this.enemyBullets = []; this.enemies = []; this.player = null;
  }

  drawMaze() {
    const g = this.mazeGfx;
    g.clear();
    g.fillStyle(0x000010,1); g.fillRect(0,0,MAZE_W,MAZE_H);
    for (let r=0; r<ROWS; r++) for (let c=0; c<COLS; c++) if (this.maze[r][c]) {
      const x = c*CELL, y = r*CELL;
      g.fillStyle(0x4444ff,1); g.fillRect(x+2,y+2,CELL-4,CELL-4);
      g.fillStyle(0x6666ff,1); g.fillRect(x+4,y+4,CELL-8,CELL-8);
      g.fillStyle(0x2222aa,1); g.fillRect(x+6,y+6,CELL-12,CELL-12);
    }
    g.fillStyle(0xff00ff,0.4);
    const wr = [(ROWS/2-1)|0,(ROWS/2)|0];
    wr.forEach(r => { g.fillRect(0,r*CELL+10,4,CELL-20); g.fillRect(MAZE_W-4,r*CELL+10,4,CELL-20); });
  }

  isWall(c,r) {
    if (r<0||r>=ROWS) return true;
    if (c<0||c>=COLS) return false;
    return this.maze[r][c]===1;
  }

  centerOf(c,r){ return {x:c*CELL+CELL/2, y:r*CELL+CELL/2}; }
  isCentered(e){ const cx=e.gridCol*CELL+CELL/2, cy=e.gridRow*CELL+CELL/2; return Math.abs(e.x-cx)<2 && Math.abs(e.y-cy)<2; }

  canMove(c,r,dir) {
    const d=DVEC[dir]; const nc=c+d.x, nr=r+d.y;
    if (nr>=0&&nr<ROWS && (nc<0||nc>=COLS)) {
      return [(ROWS/2-1)|0,(ROWS/2)|0].includes(nr);
    }
    return !this.isWall(nc,nr);
  }

  validDirs(c,r) {
    const out=[]; [DIR.LEFT,DIR.RIGHT,DIR.UP,DIR.DOWN].forEach(d=>{if(this.canMove(c,r,d))out.push(d);}); return out;
  }

  opposite(d){ return {[DIR.LEFT]:DIR.RIGHT,[DIR.RIGHT]:DIR.LEFT,[DIR.UP]:DIR.DOWN,[DIR.DOWN]:DIR.UP,[DIR.NONE]:DIR.NONE}[d]; }

  update(time, delta) {
    if (this.state !== 'playing') return;
    const dt = delta/1000;

    this.handleInput();
    if (this.player && this.player.alive) this.moveEntity(this.player, dt);

    this.enemies.forEach(e => {
      if (!e.alive) return;
      this.updateEnemyAI(e, dt, time);
      this.moveEntity(e, dt);
    });

    [this.bullets,this.enemyBullets].forEach((list,isEnemy) => {
      for (let i=list.length-1;i>=0;i--) {
        const b=list[i]; b.x+=b.vx*dt; b.y+=b.vy*dt;
        const c=Math.floor(b.x/CELL), r=Math.floor(b.y/CELL);
        if (b.x<0||b.x>MAZE_W||b.y<0||b.y>MAZE_H||this.isWall(c,r)) { b.destroy(); list.splice(i,1); }
      }
    });

    this.handleBulletCollisions();

    if (this.player && this.player.alive) {
      for (let i=this.enemyBullets.length-1;i>=0;i--) {
        const b=this.enemyBullets[i];
        if (Phaser.Math.Distance.Between(b.x,b.y,this.player.x,this.player.y)<18) {
          b.destroy(); this.enemyBullets.splice(i,1); this.killPlayer(); break;
        }
      }
    }

    if (this.player && this.player.alive) {
      for (const e of this.enemies) {
        if (e.alive && Phaser.Math.Distance.Between(e.x,e.y,this.player.x,this.player.y)<26) {
          this.killPlayer(); break;
        }
      }
    }

    const remaining = this.enemies.filter(e=>e.alive&&(e.type==='burwor'||e.type==='garwor'||e.type==='thorwor'));
    if (remaining.length===0 && !this.worlukSpawned) {
      this.worlukSpawned=true;
      const midR=(ROWS/2)|0;
      this.spawnEnemy('worluk',CELL+CELL/2,midR*CELL+CELL/2);
    }

    const worlukLeft = this.enemies.filter(e=>e.alive&&e.type==='worluk');
    if (this.worlukSpawned && worlukLeft.length===0 && !this.wizardSpawned) {
      this.wizardSpawned=true;
      if (this.level>=2 && Math.random()<0.6) {
        const midR=(ROWS/2)|0;
        this.spawnEnemy('wizard',(COLS-2)*CELL+CELL/2,midR*CELL+CELL/2);
      } else this.nextLevel();
    }

    const wizardLeft = this.enemies.filter(e=>e.alive&&e.type==='wizard');
    if (this.wizardSpawned && wizardLeft.length===0 && this.state==='playing') this.nextLevel();

    this.drawRadar();
  }

  handleInput() {
    let d = DIR.NONE;
    if (this.cursors.left.isDown) d=DIR.LEFT;
    else if (this.cursors.right.isDown) d=DIR.RIGHT;
    else if (this.cursors.up.isDown) d=DIR.UP;
    else if (this.cursors.down.isDown) d=DIR.DOWN;
    if (d===DIR.NONE) d=this.touchDir;
    if (d!==DIR.NONE) this.queuedDir=d;
    if (this.player) this.player.queuedDir=this.queuedDir;
  }

  moveEntity(e,dt) {
    const move=e.speed*dt;
    if (this.isCentered(e)) {
      e.x=e.gridCol*CELL+CELL/2; e.y=e.gridRow*CELL+CELL/2;
      if (e.queuedDir!==undefined && e.queuedDir!==DIR.NONE && this.canMove(e.gridCol,e.gridRow,e.queuedDir)) {
        e.dir=e.queuedDir;
      }
      if (!this.canMove(e.gridCol,e.gridRow,e.dir) && e.type==='player') return;
    }
    e.x += DVEC[e.dir].x*move; e.y += DVEC[e.dir].y*move;
    if (e.x < -CELL/2) e.x=MAZE_W+CELL/2;
    if (e.x > MAZE_W+CELL/2) e.x=-CELL/2;
    e.gridCol=Math.floor(e.x/CELL); e.gridRow=Math.floor(e.y/CELL);
    if (e.gridRow<0) e.gridRow=0; if (e.gridRow>ROWS-1) e.gridRow=ROWS-1;
    if (e.dir===DIR.LEFT) e.setFlipX(true);
    if (e.dir===DIR.RIGHT) e.setFlipX(false);
  }

  updateEnemyAI(e,dt,time) {
    if (e.fades) {
      const a=0.4+0.6*Math.abs(Math.sin(time/700)); e.setAlpha(a);
    } else if (e.invisible) {
      const dp=this.player?Phaser.Math.Distance.Between(e.x,e.y,this.player.x,this.player.y):9999;
      e.setAlpha(dp<80?0.4:0);
    }
    if (e.teleports) {
      e.teleportTimer-=dt*1000;
      if (e.teleportTimer<=0) {
        let tries=30;
        while(tries-->0){
          const c=Phaser.Math.Between(1,COLS-2), r=Phaser.Math.Between(1,ROWS-2);
          if(!this.isWall(c,r)){ e.gridCol=c;e.gridRow=r; e.x=c*CELL+CELL/2;e.y=r*CELL+CELL/2;
            this.tweens.add({targets:e,alpha:{from:0,to:1},duration:200}); break;}
        }
        e.teleportTimer=Phaser.Math.Between(3000,6000);
      }
    }
    if (e.flees) {
      if (this.isCentered(e)) {
        const opts=this.validDirs(e.gridCol,e.gridRow);
        const midR=(ROWS/2)|0;
        const tx=e.x<MAZE_W/2?-CELL:MAZE_W+CELL, ty=midR*CELL+CELL/2;
        opts.sort((a,b)=> Phaser.Math.Distance.Between(e.x+DVEC[a].x*CELL,e.y+DVEC[a].y*CELL,tx,ty) -
                          Phaser.Math.Distance.Between(e.x+DVEC[b].x*CELL,e.y+DVEC[b].y*CELL,tx,ty));
        if(opts.length) e.dir=opts[0];
        if(e.x<0||e.x>MAZE_W){ this.score+=e.points; this.updateHUD(); e.alive=false; e.destroy(); return; }
      }
      return;
    }
    if (this.isCentered(e)) {
      let opts=this.validDirs(e.gridCol,e.gridRow);
      const back=this.opposite(e.dir);
      const nonBack=opts.filter(d=>d!==back); const use=nonBack.length?nonBack:opts;
      let chosen=null;
      if(this.player&&Math.random()<0.5){
        const dx=this.player.x-e.x, dy=this.player.y-e.y;
        const pref=Math.abs(dx)>Math.abs(dy)?(dx<0?DIR.LEFT:DIR.RIGHT):(dy<0?DIR.UP:DIR.DOWN);
        if(use.includes(pref))chosen=pref;
      }
      e.dir=chosen||Phaser.Math.RND.pick(use)||DIR.NONE;
    } else if(!this.canMove(e.gridCol,e.gridRow,e.dir)){
      e.x=e.gridCol*CELL+CELL/2; e.y=e.gridRow*CELL+CELL/2;
    }
    e.fireTimer-=dt*1000;
    if(e.fireTimer<=0){ e.fireTimer=Phaser.Math.Between(2500,6000);
      if(this.player&&e.type!=='wizard') this.spawnEnemyBullet(e); }
  }

  drawRadar() {
    const g=this.radarGfx; g.clear();
    const y0=MAZE_H; g.fillStyle(0x111122,1); g.fillRect(0,y0,MAZE_W,RADAR_H);
    g.lineStyle(2,0x00ff88,0.7); g.strokeRect(8,y0+8,MAZE_W-16,RADAR_H-16);
    if(!this._radarTxt) this._radarTxt=this.add.text(14,y0+10,'RADAR',{fontFamily:'Press Start 2P',fontSize:'10px',color:'#00ff88'});
    const ix=16,iy=y0+20,iw=MAZE_W-32,ih=RADAR_H-30; const sx=iw/MAZE_W,sy=ih/MAZE_H;
    if(this.player&&this.player.alive){ g.fillStyle(0xffea00,1); g.fillRect(ix+this.player.x*sx-2,iy+this.player.y*sy-2,5,5); }
    this.enemies.forEach(e=>{ if(!e.alive)return;
      const cm={burwor:0x22dd33,garwor:0xdd3322,thorwor:0x3366ff,worluk:0xff8800,wizard:0xaa44ff};
      g.fillStyle(cm[e.type]||0xffffff,1); g.fillRect(ix+e.x*sx-2,iy+e.y*sy-2,4,4);
    });
  }

  tryFire() {
    if(this.state!=='playing'||!this.player||!this.player.alive)return;
    this.bullets.forEach(b=>b.destroy()); this.bullets=[];
    const d=(this.player.dir===DIR.NONE)?(this.player.queuedDir||DIR.RIGHT):this.player.dir;
    const vec=DVEC[d];
    const b=this.add.image(this.player.x+vec.x*16,this.player.y+vec.y*16,'bullet');
    b.vx=vec.x*400; b.vy=vec.y*400; if(vec.y!==0)b.angle=90;
    this.entityLayer.add(b); this.bullets.push(b);
    playShootSound();
  }

  spawnEnemyBullet(e) {
    const vec=DVEC[e.dir]; if(vec.x===0&&vec.y===0)return;
    const b=this.add.image(e.x+vec.x*16,e.y+vec.y*16,'ebullet');
    b.vx=vec.x*260; b.vy=vec.y*260; if(vec.y!==0)b.angle=90;
    this.entityLayer.add(b); this.enemyBullets.push(b);
  }

  handleBulletCollisions() {
    for(let i=this.bullets.length-1;i>=0;i--){
      const b=this.bullets[i]; let hit=false;
      for(const e of this.enemies){ if(!e.alive)continue;
        if(Phaser.Math.Distance.Between(b.x,b.y,e.x,e.y)<22){
          this.score+=e.points; this.updateHUD();
          this.explodeAt(e.x,e.y);
          e.alive=false; e.destroy(); hit=true; break;
        }
      }
      if(!hit){
        for(let j=this.enemyBullets.length-1;j>=0;j--){
          const eb=this.enemyBullets[j];
          if(Phaser.Math.Distance.Between(b.x,b.y,eb.x,eb.y)<12){ eb.destroy(); this.enemyBullets.splice(j,1); hit=true; break; }
        }
      }
      if(hit){ b.destroy(); this.bullets.splice(i,1); }
    }
  }

  explodeAt(x,y) {
    playExplosionSound();

    // Flash
    const flash = this.add.circle(x,y,12,0xffffaa);
    this.entityLayer.add(flash);
    this.tweens.add({ targets:flash, scale:3.5, alpha:0, duration:380, onComplete:()=>flash.destroy() });

    // Particles
    for(let i=0;i<14;i++){
      const p = this.add.circle(x,y, Phaser.Math.Between(2,5),
        Phaser.Math.RND.pick([0xffaa00,0xff6600,0xffdd44,0xffffff]));
      this.entityLayer.add(p);
      const ang = (i/14)*Math.PI*2 + Phaser.Math.FloatBetween(-0.4,0.4);
      const spd = Phaser.Math.Between(80,180);
      const vx = Math.cos(ang)*spd, vy = Math.sin(ang)*spd;

      this.tweens.add({
        targets:p,
        x: x + vx*0.6, y: y + vy*0.6,
        alpha:0, scale:0.2,
        duration: Phaser.Math.Between(420,720),
        onComplete:()=>p.destroy()
      });
    }
  }

  killPlayer() {
    if(this.state!=='playing')return;
    this.state='dying';
    this.explodeAt(this.player.x,this.player.y);
    this.player.alive=false; this.player.setVisible(false);
    this.lives--; this.updateHUD();
    this.time.delayedCall(900,()=>{
      if(this.lives<0){ this.gameOver(); }
      else{
        const px=((COLS/2)|0)*CELL+CELL/2, py=(ROWS-3)*CELL+CELL/2;
        this.player.x=px; this.player.y=py;
        this.player.gridCol=Math.floor(px/CELL); this.player.gridRow=Math.floor(py/CELL);
        this.player.dir=DIR.NONE; this.player.queuedDir=DIR.NONE; this.queuedDir=DIR.NONE;
        this.player.setVisible(true); this.player.alive=true; this.state='playing';
      }
    });
  }

  nextLevel() {
    if(this.state!=='playing')return;
    this.state='levelEnd'; this.level++; this.updateHUD();
    this.time.delayedCall(800,()=>this.startLevel());
  }

  gameOver() {
    this.state='gameover';
    document.getElementById('finalScore').textContent='SCORE: '+this.score;
    document.getElementById('gameOverScreen').classList.remove('hidden');
  }
}

// Phaser config
const config = {
  type: Phaser.AUTO,
  parent: 'phaserWrap',
  width: GAME_W, height: GAME_H,
  backgroundColor: '#000',
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  scene: [GameScene],
};
const game = new Phaser.Game(config);

// ============================================================
// Mobile Controls (D-Pad + Fire Button)
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
  const scene = () => window._gameScene;

  // D-Pad
  const dirs = {
    'dpad-up': DIR.UP, 'dpad-down': DIR.DOWN,
    'dpad-left': DIR.LEFT, 'dpad-right': DIR.RIGHT
  };

  Object.keys(dirs).forEach(id => {
    const btn = document.getElementById(id);
    const setDir = (d) => { const s=scene(); if(s) s.touchDir = d; };
    btn.addEventListener('pointerdown', e=>{ e.preventDefault(); setDir(dirs[id]); });
    btn.addEventListener('pointerup',   e=>{ e.preventDefault(); setDir(DIR.NONE); });
    btn.addEventListener('pointerleave',e=>{ setDir(DIR.NONE); });
    btn.addEventListener('pointercancel',()=> setDir(DIR.NONE));
  });

  // Fire button
  const fireBtn = document.getElementById('fireBtn');
  fireBtn.addEventListener('pointerdown', e => {
    e.preventDefault();
    const s = scene();
    if (s && s.tryFire) s.tryFire();
  });

  // Start / Restart buttons (unchanged)
  function startBegin() {
    document.getElementById('startScreen').classList.add('hidden');
    (function tryBegin(n){
      if(window._gameScene && window._gameScene._begin){ window._gameScene._begin(); return; }
      if(n>50)return; setTimeout(()=>tryBegin(n+1),100);
    })(0);
  }
  document.getElementById('startBtn').addEventListener('click', startBegin);
  document.getElementById('startBtn').addEventListener('touchend', e=>{e.preventDefault();startBegin();});

  document.getElementById('restartBtn').addEventListener('click', ()=>{
    document.getElementById('gameOverScreen').classList.add('hidden');
    if(window._gameScene && window._gameScene._begin) window._gameScene._begin();
  });
  document.getElementById('restartBtn').addEventListener('touchend', e=>{
    e.preventDefault();
    document.getElementById('gameOverScreen').classList.add('hidden');
    if(window._gameScene && window._gameScene._begin) window._gameScene._begin();
  });
});
</script>
