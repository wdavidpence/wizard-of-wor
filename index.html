<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Wizard of Wor</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; background:#000; overflow:hidden;
    touch-action:none; -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;
    font-family:'Press Start 2P', monospace; color:#fff;
  }
  #gameContainer { position:fixed; inset:0; width:100vw; height:100vh; overflow:hidden; }
  #phaserWrap { width:100%; height:100%; position:relative; z-index:1; }
  #phaserWrap canvas {
    position:fixed !important; top:0; left:0;
    width:100vw !important; height:100vh !important;
    z-index:0 !important; pointer-events:none !important;
  }
  #gameInputLayer { position:absolute; inset:0; z-index:2; pointer-events:auto; }

  #hud {
    position:absolute; top:0; left:0; right:0; height:42px;
    display:flex; justify-content:space-between; align-items:center;
    padding:0 12px; z-index:5; pointer-events:none;
    background:linear-gradient(to bottom, rgba(0,0,0,0.85), rgba(0,0,0,0));
    font-size:11px; color:#ffea00; text-shadow:1px 1px 0 #000;
  }
  #hud .stat { padding:0 6px; }
  #hud .stat .v { color:#fff; }

  .overlay {
    position:absolute; inset:0; z-index:10;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(0,0,0,0.85); padding:20px; text-align:center; gap:18px;
  }
  .overlay h1 {
    font-size:24px; color:#ff3366; text-shadow:2px 2px 0 #000, 0 0 16px #ff0044;
    line-height:1.4;
  }
  .overlay h2 { font-size:16px; color:#ffea00; text-shadow:2px 2px 0 #000; }
  .overlay p { font-size:9px; line-height:1.7; color:#aaffcc; max-width:340px; }
  .overlay .legend { font-size:8px; line-height:1.8; color:#fff; text-align:left; }
  .overlay .legend span { display:inline-block; width:10px; height:10px; margin-right:6px; vertical-align:middle; border:1px solid #fff; }
  .btn {
    background:#222; color:#0ff; border:2px solid #0ff;
    padding:14px 24px; font-family:inherit; font-size:12px;
    cursor:pointer; pointer-events:auto;
    text-shadow:1px 1px 0 #000; box-shadow:0 0 12px #0ff;
  }
  .btn:active { background:#0ff; color:#000; }
  .hidden { display:none !important; }

  #touchHint {
    position:absolute; bottom:8px; left:0; right:0; text-align:center;
    font-size:8px; color:#666; z-index:4; pointer-events:none;
  }
</style>
</head>
<body>
<div id="gameContainer">
  <div id="phaserWrap"></div>
  <div id="gameInputLayer"></div>

  <div id="hud">
    <div class="stat">SCORE <span class="v" id="score">0</span></div>
    <div class="stat">DUNGEON <span class="v" id="level">1</span></div>
    <div class="stat">LIVES <span class="v" id="lives">3</span></div>
  </div>

  <div id="touchHint">SWIPE to move • TAP to fire</div>

  <div id="startScreen" class="overlay">
    <h1>WIZARD<br>OF WOR</h1>
    <div class="legend">
      <div><span style="background:#22dd33"></span>BURWOR — 100 pts</div>
      <div><span style="background:#dd3322"></span>GARWOR — 200 pts (fades)</div>
      <div><span style="background:#3366ff"></span>THORWOR — 500 pts (invisible)</div>
      <div><span style="background:#ff8800"></span>WORLUK — 1000 pts (escapes)</div>
      <div><span style="background:#aa44ff"></span>WIZARD — 2500 pts (teleports)</div>
    </div>
    <p>Watch the RADAR for invisible enemies!<br>Use the WARP tunnels on the sides.</p>
    <button class="btn" id="startBtn">START</button>
  </div>

  <div id="gameOverScreen" class="overlay hidden">
    <h1>GAME OVER</h1>
    <h2 id="finalScore">SCORE: 0</h2>
    <button class="btn" id="restartBtn">PLAY AGAIN</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<script>
// ============================================================
// WIZARD OF WOR
// ============================================================
const COLS = 22;
const ROWS = 14;
const CELL = 48;
const MAZE_W = COLS * CELL;        // 1056
const MAZE_H = ROWS * CELL;        // 672
const RADAR_H = 80;
const GAME_W = MAZE_W;
const GAME_H = MAZE_H + RADAR_H;   // 752

const DIR = { NONE:0, LEFT:1, RIGHT:2, UP:3, DOWN:4 };
const DVEC = {
  [DIR.LEFT]:  { x:-1, y:0 },
  [DIR.RIGHT]: { x:1,  y:0 },
  [DIR.UP]:    { x:0,  y:-1 },
  [DIR.DOWN]:  { x:0,  y:1 },
  [DIR.NONE]:  { x:0,  y:0 },
};

// ----------------------------------------------------------
// Maze generator — symmetric, with corridors only
// ----------------------------------------------------------
function generateMaze(level) {
  // 1 = wall, 0 = corridor
  // Border walls, plus a structured grid of interior walls forming
  // corridors. We use a half-mirrored design.
  const g = [];
  for (let r=0; r<ROWS; r++) {
    g.push([]);
    for (let c=0; c<COLS; c++) g[r].push(0);
  }
  // Border top/bottom; left/right have warp gaps in middle rows
  for (let c=0; c<COLS; c++) { g[0][c] = 1; g[ROWS-1][c] = 1; }
  for (let r=0; r<ROWS; r++) {
    g[r][0] = 1; g[r][COLS-1] = 1;
  }
  // Warp tunnel openings in middle rows
  const warpRows = [ROWS/2 - 1 | 0, ROWS/2 | 0];
  warpRows.forEach(r => { g[r][0] = 0; g[r][COLS-1] = 0; });

  // Pseudo-random seed by level
  let seed = level * 7919 + 13;
  function rnd() { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }

  // Place wall segments — short vertical & horizontal blocks
  // Mirror left half to right half for symmetry
  const halfC = (COLS / 2) | 0;
  for (let r=2; r<ROWS-2; r+=2) {
    for (let c=2; c<halfC; c+=2) {
      const k = rnd();
      if (k < 0.45) {
        // vertical wall segment of length 1-2
        const len = (rnd() < 0.5) ? 1 : 2;
        for (let i=0; i<len && r+i<ROWS-2; i++) {
          g[r+i][c] = 1;
          g[r+i][COLS-1-c] = 1;
        }
      } else if (k < 0.7) {
        // horizontal short segment
        g[r][c] = 1;
        g[r][c+1] = 1;
        g[r][COLS-1-c] = 1;
        g[r][COLS-2-c] = 1;
      }
    }
  }
  // Ensure no 2x2 wall blocks (keep corridors thin & passable)
  for (let r=1; r<ROWS-1; r++) {
    for (let c=1; c<COLS-1; c++) {
      if (g[r][c] && g[r+1] && g[r][c+1] && g[r+1][c] && g[r+1][c+1]) {
        g[r+1][c+1] = 0;
        g[ROWS-2-r][COLS-2-c] = 0;
      }
    }
  }
  // Ensure central row is clear path
  const midR = (ROWS/2) | 0;
  for (let c=1; c<COLS-1; c++) g[midR][c] = 0;

  // Ensure spawn cells clear
  const spawns = [
    [midR, 2], [midR, COLS-3],
    [2, halfC-1], [2, halfC], [ROWS-3, halfC-1], [ROWS-3, halfC],
    [midR-1, halfC], [midR+1, halfC],
  ];
  spawns.forEach(([r,c]) => { if (g[r] && g[r][c]!==undefined) g[r][c]=0; });

  return g;
}

// ----------------------------------------------------------
// Phaser Scene
// ----------------------------------------------------------
class GameScene extends Phaser.Scene {
  constructor() { super('game'); }

  create() {
    window._gameScene = this;
    this.cameras.main.setBackgroundColor('#000');

    this.createTextures();

    this.score = 0;
    this.lives = 3;
    this.level = 1;
    this.state = 'idle'; // idle | playing | dying | levelEnd | gameover
    this.bullets = [];
    this.enemyBullets = [];

    this.player = null;
    this.enemies = [];

    this.maze = null;
    this.mazeGfx = this.add.graphics();
    this.entityLayer = this.add.container(0, 0);
    this.radarGfx = this.add.graphics();

    // Input
    this.cursors = this.input.keyboard.createCursorKeys();
    this.spaceKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);
    this.spaceKey.on('down', () => this.tryFire());

    this.touchDir = DIR.NONE;
    this.queuedDir = DIR.NONE;

    this.updateHUD();
  }

  // ----- textures -----
  createTextures() {
    const g = this.make.graphics({ x:0, y:0, add:false });
    function makeCreature(key, body, eye, glow) {
      g.clear();
      // glow halo
      g.fillStyle(glow, 0.25); g.fillCircle(20, 20, 19);
      // body
      g.fillStyle(body, 1); g.fillRoundedRect(4, 6, 32, 30, 6);
      // legs / fringe
      g.fillStyle(body, 1);
      g.fillRect(6, 34, 6, 6); g.fillRect(16, 34, 6, 6); g.fillRect(26, 34, 6, 6);
      // eyes
      g.fillStyle(0xffffff, 1);
      g.fillRect(11, 14, 7, 7); g.fillRect(22, 14, 7, 7);
      g.fillStyle(eye, 1);
      g.fillRect(13, 16, 4, 4); g.fillRect(24, 16, 4, 4);
      // mouth fangs
      g.fillStyle(0xffffff, 1);
      g.fillTriangle(14, 26, 18, 26, 16, 30);
      g.fillTriangle(22, 26, 26, 26, 24, 30);
      g.generateTexture(key, 40, 40);
    }
    makeCreature('burwor',  0x22dd33, 0xff0000, 0x88ff66);
    makeCreature('garwor',  0xdd3322, 0xffff00, 0xff8866);
    makeCreature('thorwor', 0x3366ff, 0xffffff, 0x88aaff);
    makeCreature('worluk',  0xff8800, 0xffffff, 0xffdd66);
    // Wizard sprite (humanoid)
    g.clear();
    g.fillStyle(0xaa44ff, 0.3); g.fillCircle(20, 20, 19);
    g.fillStyle(0xaa44ff, 1);
    g.fillTriangle(20, 0, 6, 18, 34, 18);             // hat
    g.fillStyle(0xffccaa, 1); g.fillCircle(20, 24, 8); // face
    g.fillStyle(0x000000, 1); g.fillRect(15, 22, 3, 3); g.fillRect(22, 22, 3, 3);
    g.fillStyle(0xffffff, 1); g.fillRect(8, 30, 24, 8); // beard
    g.fillStyle(0xffea00, 1); g.fillCircle(8, 20, 3); g.fillCircle(32, 20, 3); // stars
    g.generateTexture('wizard', 40, 40);

    // Player worrior (yellow)
    g.clear();
    g.fillStyle(0xffea00, 0.3); g.fillCircle(20, 20, 19);
    g.fillStyle(0xffea00, 1);
    g.fillRoundedRect(6, 8, 28, 26, 5);
    g.fillStyle(0x000000, 1);
    g.fillRect(12, 14, 5, 5); g.fillRect(23, 14, 5, 5); // eyes
    g.fillStyle(0xff0000, 1); g.fillRect(14, 24, 12, 4); // mouth
    g.fillStyle(0xffea00, 1);
    g.fillRect(8, 32, 6, 6); g.fillRect(26, 32, 6, 6);
    g.generateTexture('player', 40, 40);

    // Bullets
    g.clear();
    g.fillStyle(0xffffff, 1); g.fillRect(0, 2, 12, 4);
    g.fillStyle(0xffea00, 1); g.fillRect(2, 1, 8, 6);
    g.generateTexture('bullet', 12, 8);

    g.clear();
    g.fillStyle(0xff4488, 1); g.fillRect(0, 2, 12, 4);
    g.fillStyle(0xffaaaa, 1); g.fillRect(2, 1, 8, 6);
    g.generateTexture('ebullet', 12, 8);

    g.destroy();
  }

  // ----- HUD -----
  updateHUD() {
    document.getElementById('score').textContent = this.score;
    document.getElementById('lives').textContent = this.lives;
    document.getElementById('level').textContent = this.level;
  }

  // ----- level start -----
  _begin() {
    document.getElementById('startScreen').classList.add('hidden');
    document.getElementById('gameOverScreen').classList.add('hidden');
    this.score = 0; this.lives = 3; this.level = 1;
    this.updateHUD();
    this.startLevel();
  }

  startLevel() {
    this.clearAll();
    this.maze = generateMaze(this.level);
    this.drawMaze();

    // Player spawn — bottom center
    const midR = (ROWS/2) | 0;
    const px = ((COLS/2)|0) * CELL + CELL/2;
    const py = (ROWS-3) * CELL + CELL/2;
    this.player = this.spawnEntity('player', px, py, {
      type:'player', speed:120, dir:DIR.NONE, alive:true,
    });

    // Enemy count and types based on level
    const enemyCount = Math.min(6 + this.level, 10);
    const types = [];
    for (let i=0; i<enemyCount; i++) {
      // Increasingly include garwor / thorwor
      const r = Math.random();
      if (this.level >= 3 && r < 0.2) types.push('thorwor');
      else if (this.level >= 2 && r < 0.45) types.push('garwor');
      else types.push('burwor');
    }
    // Spawn enemies around top
    const spawnPts = [
      [2, 2], [2, 6], [2, 10], [2, 14], [2, 18],
      [4, 4], [4, 18], [midR, 2], [midR, COLS-3],
    ];
    types.forEach((t, i) => {
      const sp = spawnPts[i % spawnPts.length];
      const ex = sp[1]*CELL + CELL/2;
      const ey = sp[0]*CELL + CELL/2;
      this.spawnEnemy(t, ex, ey);
    });

    this.worlukSpawned = false;
    this.wizardSpawned = false;

    this.state = 'playing';
  }

  spawnEntity(key, x, y, props) {
    const img = this.add.image(x, y, key);
    img.setDisplaySize(CELL - 6, CELL - 6);
    Object.assign(img, props);
    img.gridCol = Math.floor(x / CELL);
    img.gridRow = Math.floor(y / CELL);
    img.moveCooldown = 0;
    this.entityLayer.add(img);
    return img;
  }

  spawnEnemy(type, x, y) {
    const cfg = {
      burwor:  { speed:55,  visible:1.0, points:100 },
      garwor:  { speed:75,  visible:0.6, points:200, fades:true },
      thorwor: { speed:95,  visible:0.0, points:500, invisible:true },
      worluk:  { speed:140, visible:1.0, points:1000, flees:true },
      wizard:  { speed:90,  visible:1.0, points:2500, teleports:true },
    }[type];
    const e = this.spawnEntity(type, x, y, {
      type, alive:true,
      dir: Phaser.Math.RND.pick([DIR.LEFT, DIR.RIGHT, DIR.UP, DIR.DOWN]),
      speed: cfg.speed,
      points: cfg.points,
      fades: cfg.fades || false,
      invisible: cfg.invisible || false,
      flees: cfg.flees || false,
      teleports: cfg.teleports || false,
      fireTimer: Phaser.Math.Between(2000, 6000),
      teleportTimer: type==='wizard' ? Phaser.Math.Between(3000, 5000) : 0,
    });
    if (cfg.invisible) e.setAlpha(0);
    else if (cfg.fades) e.setAlpha(cfg.visible);
    this.enemies.push(e);
    return e;
  }

  clearAll() {
    this.entityLayer.removeAll(true);
    this.bullets = [];
    this.enemyBullets = [];
    this.enemies = [];
    this.player = null;
  }

  // ----- draw maze -----
  drawMaze() {
    const g = this.mazeGfx;
    g.clear();
    // Floor
    g.fillStyle(0x000010, 1);
    g.fillRect(0, 0, MAZE_W, MAZE_H);
    // Walls
    for (let r=0; r<ROWS; r++) {
      for (let c=0; c<COLS; c++) {
        if (this.maze[r][c]) {
          const x = c*CELL, y = r*CELL;
          g.fillStyle(0x4444ff, 1);
          g.fillRect(x+2, y+2, CELL-4, CELL-4);
          g.fillStyle(0x6666ff, 1);
          g.fillRect(x+4, y+4, CELL-8, CELL-8);
          g.fillStyle(0x2222aa, 1);
          g.fillRect(x+6, y+6, CELL-12, CELL-12);
        }
      }
    }
    // Warp tunnel indicators
    g.fillStyle(0xff00ff, 0.4);
    const warpRows = [(ROWS/2 - 1)|0, (ROWS/2)|0];
    warpRows.forEach(r => {
      g.fillRect(0, r*CELL+10, 4, CELL-20);
      g.fillRect(MAZE_W-4, r*CELL+10, 4, CELL-20);
    });
  }

  // ----- helpers: maze nav -----
  isWall(c, r) {
    if (r < 0 || r >= ROWS) return true;
    if (c < 0 || c >= COLS) return false; // warp tunnels accessible
    return this.maze[r][c] === 1;
  }
  centerOf(c, r) { return { x: c*CELL+CELL/2, y: r*CELL+CELL/2 }; }
  isCentered(e) {
    const cx = e.gridCol*CELL + CELL/2;
    const cy = e.gridRow*CELL + CELL/2;
    return Math.abs(e.x - cx) < 2 && Math.abs(e.y - cy) < 2;
  }
  canMove(c, r, dir) {
    const d = DVEC[dir];
    const nc = c + d.x, nr = r + d.y;
    // warp tunnel passable on midRows
    if (nr >= 0 && nr < ROWS) {
      if (nc < 0 || nc >= COLS) {
        const warp = [(ROWS/2-1)|0, (ROWS/2)|0];
        return warp.includes(nr);
      }
    }
    return !this.isWall(nc, nr);
  }
  validDirs(c, r) {
    const out = [];
    [DIR.LEFT, DIR.RIGHT, DIR.UP, DIR.DOWN].forEach(d => {
      if (this.canMove(c, r, d)) out.push(d);
    });
    return out;
  }
  opposite(d) {
    return { [DIR.LEFT]:DIR.RIGHT, [DIR.RIGHT]:DIR.LEFT,
             [DIR.UP]:DIR.DOWN, [DIR.DOWN]:DIR.UP, [DIR.NONE]:DIR.NONE }[d];
  }

  // ----- update -----
  update(time, delta) {
    if (this.state !== 'playing') return;
    const dt = delta / 1000;

    this.handleInput();
    if (this.player && this.player.alive) this.moveEntity(this.player, dt);

    this.enemies.forEach(e => {
      if (!e.alive) return;
      this.updateEnemyAI(e, dt, time);
      this.moveEntity(e, dt);
    });

    // Bullets
    [this.bullets, this.enemyBullets].forEach((list, isEnemy) => {
      for (let i=list.length-1; i>=0; i--) {
        const b = list[i];
        b.x += b.vx * dt;
        b.y += b.vy * dt;
        // Walls
        const c = Math.floor(b.x/CELL), r = Math.floor(b.y/CELL);
        if (b.x<0 || b.x>MAZE_W || b.y<0 || b.y>MAZE_H || this.isWall(c, r)) {
          b.destroy();
          list.splice(i, 1);
          continue;
        }
      }
    });
    this.handleBulletCollisions();

    // Enemy bullets vs player
    if (this.player && this.player.alive) {
      for (let i=this.enemyBullets.length-1; i>=0; i--) {
        const b = this.enemyBullets[i];
        if (Phaser.Math.Distance.Between(b.x, b.y, this.player.x, this.player.y) < 18) {
          b.destroy(); this.enemyBullets.splice(i, 1);
          this.killPlayer();
          break;
        }
      }
    }

    // Enemy/player collision
    if (this.player && this.player.alive) {
      for (const e of this.enemies) {
        if (!e.alive) continue;
        if (Phaser.Math.Distance.Between(e.x, e.y, this.player.x, this.player.y) < 26) {
          this.killPlayer();
          break;
        }
      }
    }

    // Level complete: kill all burwor/garwor/thorwor → worluk; kill worluk → maybe wizard
    const remaining = this.enemies.filter(e => e.alive && (e.type==='burwor' || e.type==='garwor' || e.type==='thorwor'));
    if (remaining.length === 0 && !this.worlukSpawned) {
      this.worlukSpawned = true;
      const midR = (ROWS/2) | 0;
      this.spawnEnemy('worluk', CELL+CELL/2, midR*CELL+CELL/2);
    }
    const worlukLeft = this.enemies.filter(e => e.alive && e.type==='worluk');
    if (this.worlukSpawned && worlukLeft.length===0 && !this.wizardSpawned) {
      this.wizardSpawned = true;
      // 50% chance to spawn wizard at higher levels
      if (this.level >= 2 && Math.random() < 0.6) {
        const midR = (ROWS/2) | 0;
        this.spawnEnemy('wizard', (COLS-2)*CELL+CELL/2, midR*CELL+CELL/2);
      } else {
        this.nextLevel();
      }
    }
    const wizardLeft = this.enemies.filter(e => e.alive && e.type==='wizard');
    if (this.wizardSpawned && wizardLeft.length===0 && this.state==='playing') {
      this.nextLevel();
    }

    this.drawRadar();
  }

  handleInput() {
    let d = DIR.NONE;
    if (this.cursors.left.isDown) d = DIR.LEFT;
    else if (this.cursors.right.isDown) d = DIR.RIGHT;
    else if (this.cursors.up.isDown) d = DIR.UP;
    else if (this.cursors.down.isDown) d = DIR.DOWN;
    if (d === DIR.NONE) d = this.touchDir;
    if (d !== DIR.NONE) this.queuedDir = d;
    if (this.player) this.player.queuedDir = this.queuedDir;
  }

  moveEntity(e, dt) {
    const move = e.speed * dt;
    const d = DVEC[e.dir];
    // If at cell center, decide direction
    if (this.isCentered(e)) {
      e.x = e.gridCol*CELL + CELL/2;
      e.y = e.gridRow*CELL + CELL/2;
      // Try queued direction for player
      if (e.queuedDir !== undefined && e.queuedDir !== DIR.NONE) {
        if (this.canMove(e.gridCol, e.gridRow, e.queuedDir)) {
          e.dir = e.queuedDir;
        }
      }
      // If current dir blocked, stop
      if (!this.canMove(e.gridCol, e.gridRow, e.dir)) {
        if (e.type === 'player') return;
        // enemies pick new direction (handled in AI)
      }
    }
    // Move
    e.x += DVEC[e.dir].x * move;
    e.y += DVEC[e.dir].y * move;
    // Warp tunnels
    if (e.x < -CELL/2) e.x = MAZE_W + CELL/2;
    if (e.x > MAZE_W + CELL/2) e.x = -CELL/2;
    // Update grid cell when crossing center
    e.gridCol = Math.floor(e.x / CELL);
    e.gridRow = Math.floor(e.y / CELL);
    if (e.gridRow < 0) e.gridRow = 0;
    if (e.gridRow > ROWS-1) e.gridRow = ROWS-1;
    // Facing
    if (e.dir === DIR.LEFT)  e.setFlipX(true);
    if (e.dir === DIR.RIGHT) e.setFlipX(false);
  }

  updateEnemyAI(e, dt, time) {
    // Fade/blink for garwor
    if (e.fades) {
      const a = 0.4 + 0.6 * Math.abs(Math.sin(time/700));
      e.setAlpha(a);
    } else if (e.invisible) {
      // thorwor — only briefly visible when shooting or near player
      const dp = this.player ? Phaser.Math.Distance.Between(e.x, e.y, this.player.x, this.player.y) : 9999;
      e.setAlpha(dp < 80 ? 0.4 : 0);
    }
    // Teleport (wizard)
    if (e.teleports) {
      e.teleportTimer -= dt*1000;
      if (e.teleportTimer <= 0) {
        // Teleport to random open cell
        let tries = 30;
        while (tries-- > 0) {
          const c = Phaser.Math.Between(1, COLS-2);
          const r = Phaser.Math.Between(1, ROWS-2);
          if (!this.isWall(c, r)) {
            e.gridCol = c; e.gridRow = r;
            e.x = c*CELL+CELL/2; e.y = r*CELL+CELL/2;
            // flash
            this.tweens.add({ targets:e, alpha:{from:0, to:1}, duration:200 });
            break;
          }
        }
        e.teleportTimer = Phaser.Math.Between(3000, 6000);
      }
    }
    // Worluk flees toward warp tunnel
    if (e.flees) {
      if (this.isCentered(e)) {
        const opts = this.validDirs(e.gridCol, e.gridRow);
        // prefer the dir that gets closer to a warp tunnel
        const midR = (ROWS/2) | 0;
        const targetX = e.x < MAZE_W/2 ? -CELL : MAZE_W + CELL;
        const targetY = midR * CELL + CELL/2;
        opts.sort((a, b) => {
          const da = DVEC[a], db = DVEC[b];
          const ax = e.x + da.x*CELL, ay = e.y + da.y*CELL;
          const bx = e.x + db.x*CELL, by = e.y + db.y*CELL;
          return Phaser.Math.Distance.Between(ax, ay, targetX, targetY)
               - Phaser.Math.Distance.Between(bx, by, targetX, targetY);
        });
        if (opts.length) e.dir = opts[0];
        // escape via tunnel = bonus
        if (e.x < 0 || e.x > MAZE_W) {
          this.score += e.points;
          this.updateHUD();
          e.alive = false;
          e.destroy();
          return;
        }
      }
      return;
    }
    // Standard enemy: at intersections, pick a direction
    if (this.isCentered(e)) {
      let opts = this.validDirs(e.gridCol, e.gridRow);
      const back = this.opposite(e.dir);
      const nonBack = opts.filter(d => d !== back);
      const useOpts = nonBack.length > 0 ? nonBack : opts;
      // Chase player with 40% probability if player visible in line
      let chosen = null;
      if (this.player && Math.random() < 0.5) {
        const dx = this.player.x - e.x;
        const dy = this.player.y - e.y;
        let pref;
        if (Math.abs(dx) > Math.abs(dy)) pref = dx < 0 ? DIR.LEFT : DIR.RIGHT;
        else pref = dy < 0 ? DIR.UP : DIR.DOWN;
        if (useOpts.includes(pref)) chosen = pref;
      }
      if (chosen === null) chosen = Phaser.Math.RND.pick(useOpts);
      e.dir = chosen || DIR.NONE;
    } else {
      // If blocked mid-cell, reset to grid
      if (!this.canMove(e.gridCol, e.gridRow, e.dir)) {
        // snap
        e.x = e.gridCol*CELL+CELL/2; e.y = e.gridRow*CELL+CELL/2;
      }
    }
    // Fire
    e.fireTimer -= dt*1000;
    if (e.fireTimer <= 0) {
      e.fireTimer = Phaser.Math.Between(2500, 6000);
      if (this.player && e.type !== 'wizard') {
        // Fire in current direction
        this.spawnEnemyBullet(e);
      }
    }
  }

  drawRadar() {
    const g = this.radarGfx;
    g.clear();
    const y0 = MAZE_H;
    g.fillStyle(0x111122, 1);
    g.fillRect(0, y0, MAZE_W, RADAR_H);
    g.lineStyle(2, 0x00ff88, 0.7);
    g.strokeRect(8, y0+8, MAZE_W-16, RADAR_H-16);
    // label
    if (!this._radarTxt) {
      this._radarTxt = this.add.text(14, y0+10, 'RADAR', {
        fontFamily:'Press Start 2P', fontSize:'10px', color:'#00ff88',
      });
    }
    const innerX = 16, innerY = y0+20, innerW = MAZE_W-32, innerH = RADAR_H-30;
    const sx = innerW / MAZE_W, sy = innerH / MAZE_H;
    // Player
    if (this.player && this.player.alive) {
      g.fillStyle(0xffea00, 1);
      g.fillRect(innerX + this.player.x*sx - 2, innerY + this.player.y*sy - 2, 5, 5);
    }
    // Enemies — show ALL even invisible ones
    this.enemies.forEach(e => {
      if (!e.alive) return;
      const colorMap = {
        burwor:0x22dd33, garwor:0xdd3322, thorwor:0x3366ff,
        worluk:0xff8800, wizard:0xaa44ff,
      };
      g.fillStyle(colorMap[e.type] || 0xffffff, 1);
      g.fillRect(innerX + e.x*sx - 2, innerY + e.y*sy - 2, 4, 4);
    });
  }

  tryFire() {
    if (this.state !== 'playing' || !this.player || !this.player.alive) return;
    // Single-shot rule: cancel existing
    this.bullets.forEach(b => b.destroy());
    this.bullets = [];
    const d = (this.player.dir === DIR.NONE) ? (this.player.queuedDir || DIR.RIGHT) : this.player.dir;
    const vec = DVEC[d];
    const b = this.add.image(this.player.x + vec.x*16, this.player.y + vec.y*16, 'bullet');
    b.vx = vec.x * 400;
    b.vy = vec.y * 400;
    if (vec.y !== 0) b.angle = 90;
    this.entityLayer.add(b);
    this.bullets.push(b);
  }

  spawnEnemyBullet(e) {
    const vec = DVEC[e.dir];
    if (vec.x===0 && vec.y===0) return;
    const b = this.add.image(e.x + vec.x*16, e.y + vec.y*16, 'ebullet');
    b.vx = vec.x * 260;
    b.vy = vec.y * 260;
    if (vec.y !== 0) b.angle = 90;
    this.entityLayer.add(b);
    this.enemyBullets.push(b);
  }

  handleBulletCollisions() {
    // Player bullets vs enemies
    for (let i=this.bullets.length-1; i>=0; i--) {
      const b = this.bullets[i];
      let hit = false;
      for (const e of this.enemies) {
        if (!e.alive) continue;
        if (Phaser.Math.Distance.Between(b.x, b.y, e.x, e.y) < 22) {
          this.score += e.points;
          this.updateHUD();
          // explosion
          this.flashAt(e.x, e.y);
          e.alive = false;
          e.destroy();
          hit = true;
          break;
        }
      }
      // Bullet vs bullet
      if (!hit) {
        for (let j=this.enemyBullets.length-1; j>=0; j--) {
          const eb = this.enemyBullets[j];
          if (Phaser.Math.Distance.Between(b.x, b.y, eb.x, eb.y) < 12) {
            eb.destroy(); this.enemyBullets.splice(j, 1);
            hit = true;
            break;
          }
        }
      }
      if (hit) {
        b.destroy();
        this.bullets.splice(i, 1);
      }
    }
  }

  flashAt(x, y) {
    const c = this.add.circle(x, y, 8, 0xffffaa);
    this.entityLayer.add(c);
    this.tweens.add({
      targets:c, radius:30, alpha:0, duration:350,
      onUpdate:(tw)=>{ c.setRadius?.(c.radius); },
      onComplete:()=>c.destroy(),
    });
    // Use scale tween since radius isn't tweenable on Arc
    c.setScale(0.3);
    this.tweens.add({ targets:c, scale:2.2, alpha:0, duration:350,
      onComplete:()=>c.destroy() });
  }

  killPlayer() {
    if (this.state !== 'playing') return;
    this.state = 'dying';
    this.flashAt(this.player.x, this.player.y);
    this.player.alive = false;
    this.player.setVisible(false);
    this.lives--;
    this.updateHUD();
    this.time.delayedCall(900, () => {
      if (this.lives < 0) {
        this.gameOver();
      } else {
        // Respawn
        const px = ((COLS/2)|0) * CELL + CELL/2;
        const py = (ROWS-3) * CELL + CELL/2;
        this.player.x = px; this.player.y = py;
        this.player.gridCol = Math.floor(px/CELL);
        this.player.gridRow = Math.floor(py/CELL);
        this.player.dir = DIR.NONE;
        this.player.queuedDir = DIR.NONE;
        this.queuedDir = DIR.NONE;
        this.player.setVisible(true);
        this.player.alive = true;
        this.state = 'playing';
      }
    });
  }

  nextLevel() {
    if (this.state !== 'playing') return;
    this.state = 'levelEnd';
    this.level++;
    this.updateHUD();
    this.time.delayedCall(800, () => this.startLevel());
  }

  gameOver() {
    this.state = 'gameover';
    document.getElementById('finalScore').textContent = 'SCORE: ' + this.score;
    document.getElementById('gameOverScreen').classList.remove('hidden');
  }
}

// ----------------------------------------------------------
// Phaser config
// ----------------------------------------------------------
const config = {
  type: Phaser.AUTO,
  parent: 'phaserWrap',
  width: GAME_W,
  height: GAME_H,
  backgroundColor: '#000',
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  scene: [GameScene],
};
const game = new Phaser.Game(config);

// ----------------------------------------------------------
// Mobile touch — swipe to move, tap to fire
// ----------------------------------------------------------
document.addEventListener('DOMContentLoaded', () => {
  const inputLayer = document.getElementById('gameInputLayer');
  inputLayer.style.touchAction = 'none';
  inputLayer.style.webkitTouchCallout = 'none';
  inputLayer.style.webkitUserSelect = 'none';

  let startX=0, startY=0, startT=0, moved=false;
  const TAP_MAX_DIST = 14, TAP_MAX_T = 300, SWIPE_MIN = 20;

  function isOverlay(el) {
    while (el && el !== document.body) {
      if (el.id && ['startScreen','gameOverScreen','startBtn','restartBtn','hud'].includes(el.id)) return true;
      if (el.classList && (el.classList.contains('btn') || el.classList.contains('overlay'))) return true;
      el = el.parentElement;
    }
    return false;
  }

  inputLayer.addEventListener('pointerdown', (e) => {
    if (isOverlay(e.target)) return;
    e.preventDefault();
    startX = e.clientX; startY = e.clientY; startT = Date.now(); moved = false;
  }, { passive:false });

  inputLayer.addEventListener('pointermove', (e) => {
    if (isOverlay(e.target)) return;
    const dx = e.clientX - startX, dy = e.clientY - startY;
    if (Math.abs(dx) > SWIPE_MIN || Math.abs(dy) > SWIPE_MIN) {
      moved = true;
      const scene = window._gameScene;
      if (!scene) return;
      let d;
      if (Math.abs(dx) > Math.abs(dy)) d = dx < 0 ? DIR.LEFT : DIR.RIGHT;
      else d = dy < 0 ? DIR.UP : DIR.DOWN;
      scene.touchDir = d;
      // reset for continued swipe direction changes
      startX = e.clientX; startY = e.clientY;
    }
  }, { passive:false });

  inputLayer.addEventListener('pointerup', (e) => {
    if (isOverlay(e.target)) return;
    e.preventDefault();
    const dx = e.clientX - startX, dy = e.clientY - startY;
    const dist = Math.hypot(dx, dy), dt = Date.now() - startT;
    const scene = window._gameScene;
    if (!moved && dist < TAP_MAX_DIST && dt < TAP_MAX_T) {
      if (scene && scene.tryFire) scene.tryFire();
    }
    if (scene) scene.touchDir = DIR.NONE;
  }, { passive:false });

  inputLayer.addEventListener('pointercancel', () => {
    const scene = window._gameScene;
    if (scene) scene.touchDir = DIR.NONE;
  });

  // Start / restart buttons
  function startBegin() {
    document.getElementById('startScreen').classList.add('hidden');
    (function tryBegin(n) {
      if (window._gameScene && window._gameScene._begin) {
        window._gameScene._begin(); return;
      }
      if (n > 50) return;
      setTimeout(()=>tryBegin(n+1), 100);
    })(0);
  }
  document.getElementById('startBtn').addEventListener('click', startBegin);
  document.getElementById('startBtn').addEventListener('touchend', (e)=>{ e.preventDefault(); startBegin(); });
  document.getElementById('restartBtn').addEventListener('click', () => {
    document.getElementById('gameOverScreen').classList.add('hidden');
    if (window._gameScene && window._gameScene._begin) window._gameScene._begin();
  });
  document.getElementById('restartBtn').addEventListener('touchend', (e) => {
    e.preventDefault();
    document.getElementById('gameOverScreen').classList.add('hidden');
    if (window._gameScene && window._gameScene._begin) window._gameScene._begin();
  });
});
</script>
