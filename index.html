// WIZARD OF WOR — Arcade Faithful Recreation (1981 Midway)
// Refactored: 2-player co-op, attract mode, CRT, color walls
// ============================================================

// Arcade-accurate dimensions
const COLS = 22, ROWS = 14, CELL = 48;
const MAZE_W = COLS * CELL, MAZE_H = ROWS * CELL;
const RADAR_H = 64;
const GAME_W = MAZE_W, GAME_H = MAZE_H + RADAR_H;

// Sprite sizes - arcade uses 8x8 pixel art
const SPRITE_SIZE = 48;

const DIR = { NONE:0, LEFT:1, RIGHT:2, UP:3, DOWN:4 };
const DVEC = {
  [DIR.LEFT]:{x:-1,y:0}, [DIR.RIGHT]:{x:1,y:0},
  [DIR.UP]:{x:0,y:-1},   [DIR.DOWN]:{x:0,y:1}, [DIR.NONE]:{x:0,y:0}
};

// Arcade-accurate wall color cycling (5 colors)
const WALL_COLORS = [0x2244cc, 0x22cc44, 0xcc2222, 0xcccc22, 0x22cccc];

// Player colors - P1 is YELLOW, P2 is BLUE (arcade accurate)
const P1_COLOR = 0xffea00;  // Yellow
const P2_COLOR = 0x4488ff;  // Blue

// Fixed maze templates (arcade uses 20-30 set layouts)

  // Template 0: Simple corridors
  [
    "1111111111111111111111",
    "1000000000000000000001",
    "1011101110111011101111",
    "1000000000000000000001",
    "1011101110111011101111",
    "1000000000000000000001",

    "1000000000000000000001",
    "1010101010101010101011",
    "1000000000000000000001",

    "1010101010101010101011",
    "1000000000000000000001",
    "1010101010101010101011",
    "1000000000000000000001",
    "1010101010101010101011",
    "1111111111111111111111"
  ]
];

// Helper to convert string template to 2D array
function parseMazeTemplate(template) {
  const result = [];
  for (let r = 0; r < ROWS; r++) {
    const row = [];
    for (let c = 0; c < COLS; c++) {
      row.push(template[r][c] === '1' ? 1 : 0);
    }
    result.push(row);
  }
  return result;
}

// ============================================================
// HIGH SCORE PERSISTENCE
// ============================================================

function getHighScores() {
  try { return JSON.parse(localStorage.getItem('wor_highscores') || '[]'); }
  catch(e) { return []; }
}

function saveScore(score, level) {
  const scores = getHighScores();
  scores.push({ score: score, level: level, date: Date.now() });
  scores.sort((a, b) => b.score - a.score);
  localStorage.setItem('wor_highscores', JSON.stringify(scores.slice(0, 5)));
}

function formatScore(s) { return s.toString().padStart(7, '0'); }

let audioCtx = null;
function getAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function playDragnetTheme() {
  try {
    const ctx = getAudio();
    const notes = [261.63, 392.00, 523.25, 392.00, 523.25];
    const now = ctx.currentTime;
    notes.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'square';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.15, now + i * 0.2);
      gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.2 + 0.18);
      osc.connect(gain).connect(ctx.destination);
      osc.start(now + i * 0.2);
      osc.stop(now + i * 0.2 + 0.2);
    });
  } catch(e) {}
}

function playShootSound() {
  try {
    const ctx = getAudio();
    const osc = ctx.createOscillator();

    osc.type = 'square';
    osc.frequency.setValueAtTime(800, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(200, ctx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.12, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
    osc.connect(gain).connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.1);
  } catch(e) {}
}

function playExplosionSound() {
  try {
    const ctx = getAudio();
    const bufferSize = ctx.sampleRate * 0.3;
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2);
    }
    const source = ctx.createBufferSource();
    const gain = ctx.createGain();
    source.buffer = buffer;
    gain.gain.setValueAtTime(0.2, ctx.currentTime);
    source.connect(gain).connect(ctx.destination);
    source.start();
  } catch(e) {}
}

// ============================================================
// MAZE GENERATION
// ============================================================

function generateMaze(level) {
  const g = [];
  for (let r = 0; r < ROWS; r++) {
    g.push([]);
    for (let c = 0; c < COLS; c++) g[r].push(0);
  }
  for (let c = 0; c < COLS; c++) { g[0][c] = 1; g[ROWS-1][c] = 1; }
  for (let r = 0; r < ROWS; r++) { g[r][0] = 1; g[r][COLS-1] = 1; }
  const m1 = (ROWS/2-1)|0, m2 = (ROWS/2)|0;
  g[m1][0] = 0; g[m1][COLS-1] = 0; g[m2][0] = 0; g[m2][COLS-1] = 0;

  let seed = level * 7919 + 13;
  function rnd() { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }

  const halfC = (COLS/2)|0;
  const halfR = (ROWS/2)|0;

  function paintCell(r, c, v) {
    if (r <= 0 || r >= ROWS-1 || c <= 0 || c >= COLS-1) return;
    g[r][c] = v;
    g[ROWS-1-r][c] = v;
    g[r][COLS-1-c] = v;
    g[ROWS-1-r][COLS-1-c] = v;
  }

  const wallChance = Math.max(0.25, 0.50 - level * 0.025);
  const stickChance = Math.max(0.30, 0.65 - level * 0.025);

  for (let r = 2; r < halfR; r += 2) {
    for (let c = 2; c < halfC; c += 2) {
      const k = rnd();
      if (k < wallChance) {
        const len = (rnd() < 0.55) ? 2 : 1;
        for (let i = 0; i < len && r + i < halfR; i++) paintCell(r+i, c, 1);
      } else if (k < stickChance) {
        paintCell(r, c, 1);
        if (c+1 < halfC) paintCell(r, c+1, 1);
      } else if (k < stickChance + 0.13) {
        paintCell(r, c, 1);
      }
    }
  }

  for (let c = 1; c < COLS-1; c++) g[m1][c] = 0;
  for (let c = 1; c < COLS-1; c++) {
    if (g[m2][c] === 1 && rnd() < 0.6) g[m2][c] = 0;
  }

  const isPit = (level >= 13 && (level - 13) % 6 === 0);
  const isArena = (level === 6);

  if (isArena) {
    for (let r = 3; r < 11; r++) {
      for (let c = 5; c < 17; c++) g[r][c] = 0;
    }
  }

  if (isPit) {
    for (let r = 2; r < ROWS-2; r += 2) {
      for (let c = 2; c < COLS-2; c += 2) {
        if (rnd() < 0.15) paintCell(r, c, 1);
      }
    }
  }

  const startR = ROWS-3, startC = (COLS/2)|0;
  paintCell(startR, startC, 0);
  paintCell(startR, startC-1, 0);
  paintCell(2, 2, 0); paintCell(2, 4, 0); paintCell(2, 6, 0);
  paintCell(2, halfC-1, 0); paintCell(2, halfC, 0);

  return g;
}

function isWall(maze, c, r) {
  if (r < 0 || r >= ROWS) return true;
  if (c < 0 || c >= COLS) return false;
  return maze[r][c] === 1;
}

function findOpenCell(maze, c, r) {
  if (!isWall(maze, c, r) && r >= 0 && r < ROWS && c >= 0 && c < COLS) return {c, r};
  const seen = new Set();
  const key = (cc, rr) => rr * COLS + cc;
  const q = [[c, r]]; seen.add(key(c, r));
  while (q.length) {
    const [cc, rr] = q.shift();
    if (rr > 0 && rr < ROWS-1 && cc > 0 && cc < COLS-1 && !isWall(maze, cc, rr)) return {c:cc, r:rr};
    [[0,-1],[0,1],[-1,0],[1,0]].forEach(([dc, dr]) => {
      const nk = key(cc+dc, rr+dr);
      if (!seen.has(nk) && cc+dc >= 0 && cc+dc < COLS && rr+dr >= 0 && rr+dr < ROWS) {
        seen.add(nk); q.push([cc+dc, rr+dr]);
      }
    });
  }
  return null;
}

  update(time, delta) {
    const dt = delta / 1000;

    // Attract mode
    if (this.attractMode) {
      // Animate decorative enemies
      this.attractDecor.forEach(e => {
        if (!e.isDecor) return;
        const move = e.decorSpeed * dt;
        if (e.dir === DIR.LEFT || e.dir === DIR.RIGHT) e.y += 0;
        else if (e.dir === DIR.UP || e.dir === DIR.DOWN) e.x += 0;

        // Random direction changes
        if (Math.random() < 0.01) {
          e.dir = Phaser.Math.RND.pick([DIR.LEFT, DIR.RIGHT, DIR.UP, DIR.DOWN]);
        }
        e.x += DVEC[e.dir].x * move;
        e.y += DVEC[e.dir].y * move;

        // Wrap
        if (e.x < -CELL) e.x = MAZE_W + CELL;
        if (e.x > MAZE_W + CELL) e.x = -CELL;
        if (e.y < -CELL) e.y = MAZE_H + CELL;
        if (e.y > MAZE_H + CELL) e.y = -CELL;

        // Clamp to bounds
        e.x = Phaser.Math.Clamp(e.x, CELL, MAZE_W - CELL);
        e.y = Phaser.Math.Clamp(e.y, CELL, MAZE_H - CELL);
      });
      return;
    }

    if (this.state !== 'playing') return;
    const elapsed = time - this.dungeonStartTime;
    const speedMultiplier = 1 + Math.floor(elapsed / this.speedUpInterval) * 0.15;

    this.handleInput();

    // Player 1 movement
    if (this.player && this.player.alive) {
      this.player.speed = 120 * Math.min(speedMultiplier, 3);
      this.moveEntity(this.player, dt);
    }

    // Player 2 movement
    if (this.player2 && this.player2.alive) {
      this.player2.speed = 120 * Math.min(speedMultiplier, 3);
      this.moveEntity(this.player2, dt);
    }

    // Enemies
    this.enemies.forEach(e => {
      if (!e.alive) return;
      const baseSpeed = e.baseSpeed || e.speed;
      e.speed = baseSpeed * Math.min(speedMultiplier, 3);
      this.updateEnemyAI(e, dt, time);
      this.moveEntity(e, dt);
    });

    // Bullets
    [this.bullets, this.enemyBullets].forEach((list, isE) => {
      for (let i = list.length - 1; i >= 0; i--) {
        const b = list[i];
        b.x += b.vx * dt; b.y += b.vy * dt;
        const c = Math.floor(b.x / CELL), r = Math.floor(b.y / CELL);
        if (b.x < 0 || b.x > MAZE_W || b.y < 0 || b.y > MAZE_H || isWall(this.maze, c, r)) {
          b.destroy(); list.splice(i, 1);
        }
      }
    });

    this.handleBulletCollisions();

    // Player 1 hit by enemy bullet
    if (this.player && this.player.alive) {
      for (let i = this.enemyBullets.length - 1; i >= 0; i--) {
        const b = this.enemyBullets[i];
        if (Phaser.Math.Distance.Between(b.x, b.y, this.player.x, this.player.y) < 18) {
          b.destroy(); this.enemyBullets.splice(i, 1);
          this.killCurrentPlayer(this.player, 'p1'); break;
        }
      }
    }

    // Player 2 hit by enemy bullet
    if (this.player2 && this.player2.alive) {
      for (let i = this.enemyBullets.length - 1; i >= 0; i--) {
        const b = this.enemyBullets[i];
        if (Phaser.Math.Distance.Between(b.x, b.y, this.player2.x, this.player2.y) < 18) {
          b.destroy(); this.enemyBullets.splice(i, 1);
          this.killCurrentPlayer(this.player2, 'p2'); break;
        }
      }
    }

    // Player 1 contact with enemy
    if (this.player && this.player.alive) {
      for (const e of this.enemies) {
        if (e.alive && Phaser.Math.Distance.Between(e.x, e.y, this.player.x, this.player.y) < 26) {
          this.killCurrentPlayer(this.player, 'p1'); break;
        }
      }
    }

    // Player 2 contact with enemy
    if (this.player2 && this.player2.alive) {
      for (const e of this.enemies) {
        if (e.alive && Phaser.Math.Distance.Between(e.x, e.y, this.player2.x, this.player2.y) < 26) {
          this.killCurrentPlayer(this.player2, 'p2'); break;
        }
      }
    }

    // Backup warrior timer
    if (this.backupActive) {
      this.backupTimer -= dt * 1000;
      if (this.backupTimer <= 0) {
        const targetPlayer = this.backupPlayer === 'p1' ? this.player : this.player2;
        if (targetPlayer && !targetPlayer.alive) {
          targetPlayer.x = this.backupX;
          targetPlayer.y = this.backupY;
          targetPlayer.gridCol = Math.floor(this.backupX / CELL);
          targetPlayer.gridRow = Math.floor(this.backupY / CELL);
          targetPlayer.dir = DIR.NONE;
          targetPlayer.queuedDir = DIR.NONE;
          targetPlayer.setVisible(true);
          targetPlayer.alive = true;
          this.backupActive = false;
          if (this.backupGroup) { this.backupGroup.destroy(); this.backupGroup = null; }
        }
      }
      if (this.backupGroup) {
        this.backupGroup.children.iterate(child => {
          if (child instanceof Phaser.GameObjects.Text) {
            const secs = Math.ceil(this.backupTimer / 1000);
            child.setText(secs > 0 ? 'BOX ' + secs : '!!');
          }
        });
      }
    }

    // Spawn Worluk
    const rem = this.enemies.filter(e => e.alive && (e.type === 'burwor' || e.type === 'garwor' || e.type === 'thorwor'));
    if (rem.length === 0 && !this.worlukSpawned) {
      this.worlukSpawned = true;
      const m = (ROWS/2)|0;
      const s = this.findOpenCell(this.maze, 1, m);
      if (s) this.spawnEnemy('worluk', s.c*CELL+CELL/2, s.r*CELL+CELL/2);
    }

    // Spawn Wizard
    const wl = this.enemies.filter(e => e.alive && e.type === 'worluk');
    if (this.worlukSpawned && wl.length === 0 && !this.wizardSpawned) {
      this.wizardSpawned = true;
      if (this.level >= 2 && Math.random() < 0.6) {
        const m = (ROWS/2)|0;
        const s = this.findOpenCell(this.maze, COLS-2, m);
        if (s) this.spawnEnemy('wizard', s.c*CELL+CELL/2, s.r*CELL+CELL/2);
      } else {
        this.nextLevel(); return;
      }
    }

    // Wizard dead → next level
    const wz = this.enemies.filter(e => e.alive && e.type === 'wizard');
    if (this.wizardSpawned && wz.length === 0 && this.state === 'playing') {
      this.nextLevel(); return;
    }

    this.updateHUD();
    this.drawCRT();
  }

  handleInput() {
    let d = DIR.NONE;
    if (this.cursors.left.isDown) d = DIR.LEFT;
    else if (this.cursors.right.isDown) d = DIR.RIGHT;
    else if (this.cursors.up.isDown) d = DIR.UP;
    else if (this.cursors.down.isDown) d = DIR.DOWN;
    if (d === DIR.NONE) d = this.touchDir;
    if (d !== DIR.NONE) this.queuedDir = d;
    if (this.player) this.player.queuedDir = this.queuedDir;

    // P2 input
    let d2 = DIR.NONE;
    if (this.numPadEnter.isDown) d2 = DIR.DOWN;
    if (this.numPad0.isDown) d2 = DIR.UP;
    // Also support WASD for P2
    const wKey = this.input.keyboard.addKey('W');
    const aKey = this.input.keyboard.addKey('A');
    const sKey = this.input.keyboard.addKey('S');
    const dKey = this.input.keyboard.addKey('D');
    if (aKey.isDown) d2 = DIR.LEFT;
    else if (dKey.isDown) d2 = DIR.RIGHT;
    else if (wKey.isDown) d2 = DIR.UP;
    else if (sKey.isDown) d2 = DIR.DOWN;
    if (d2 === DIR.NONE) d2 = this.touchDir2;
    if (d2 !== DIR.NONE) this.queuedDir2 = d2;
    if (this.player2) this.player2.queuedDir = this.queuedDir2;
  }

  moveEntity(e, dt) {
    const move = e.speed * dt;
    const cx = e.gridCol * CELL + CELL/2;
    const cy = e.gridRow * CELL + CELL/2;

    if (e.dir === DIR.LEFT || e.dir === DIR.RIGHT) e.y = cy;
    else if (e.dir === DIR.UP || e.dir === DIR.DOWN) e.x = cx;

    if (this.isCentered(e)) {
      e.x = cx; e.y = cy;
      if (e.queuedDir !== undefined && e.queuedDir !== DIR.NONE && this.canMove(e.gridCol, e.gridRow, e.queuedDir)) {
        e.dir = e.queuedDir;
      }
      if (!this.canMove(e.gridCol, e.gridRow, e.dir) && e.type === 'player') return;
    }

    e.x += DVEC[e.dir].x * move;
    e.y += DVEC[e.dir].y * move;

    if (e.x < -CELL/2) e.x = MAZE_W + CELL/2;
    if (e.x > MAZE_W + CELL/2) e.x = -CELL/2;

    e.gridCol = Math.floor(e.x / CELL);
    e.gridRow = Math.floor(e.y / CELL);
    if (e.gridRow < 0) e.gridRow = 0;
    if (e.gridRow > ROWS-1) e.gridRow = ROWS-1;

    // Rotate top-view sprites
    if (e._isTopView) {
      if (e.dir === DIR.UP) e.angle = 0;
      else if (e.dir === DIR.RIGHT) e.angle = 90;
      else if (e.dir === DIR.DOWN) e.angle = 180;
      else if (e.dir === DIR.LEFT) e.angle = 270;
    } else {
      if (e.dir === DIR.LEFT) e.setFlipX(true);
      if (e.dir === DIR.RIGHT) e.setFlipX(false);
    }

    if (e._halo) {
      e._halo.x = e.x; e._halo.y = e.y;
      e._halo.setAlpha(0.18 + 0.10 * Math.sin(performance.now() / 250));
    }
  }

  updateEnemyAI(e, dt, time) {
    if (e.fades) {
      const a = 0.4 + 0.6 * Math.abs(Math.sin(time / 700));
      e.setAlpha(a);
    }
    if (e.invisible) { e.setAlpha(0); }

    // Wizard teleporting
    if (e.teleports) {
      e.teleportTimer -= dt * 1000;
      if (e.teleportTimer <= 0) {
        let tries = 30;
        while (tries-- > 0) {
          const c = Phaser.Math.Between(1, COLS-2);
          const r = Phaser.Math.Between(1, ROWS-2);
          if (!this.isWall(this.maze, c, r)) {
            e.gridCol = c; e.gridRow = r;
            e.x = c * CELL + CELL/2; e.y = r * CELL + CELL/2;
            this.tweens.add({ targets: e, alpha: { from: 0, to: 1 }, duration: 200 });
            playWizardTaunt();
            this.showTaunt();
            break;
          }
        }
        e.teleportTimer = Phaser.Math.Between(3000, 6000);
      }
    }

    if (e.flees) {
      if (e.escapeTimer > 0) e.escapeTimer = Math.max(0, e.escapeTimer - dt * 1000);
      if (this.isCentered(e)) {
        const opts = this.validDirs(e.gridCol, e.gridRow);
        const midR = (ROWS/2)|0;
        const tx = e.fleeRight ? MAZE_W + CELL : -CELL;
        const ty = midR * CELL + CELL/2;
        opts.sort((a, b) =>
          Phaser.Math.Distance.Between(e.x + DVEC[a].x * CELL, e.y + DVEC[a].y * CELL, tx, ty) -
          Phaser.Math.Distance.Between(e.x + DVEC[b].x * CELL, e.y + DVEC[b].y * CELL, tx, ty)
        );
        if (opts.length) e.dir = opts[0];
        if (e.escapeTimer <= 0 && (e.x < 0 || e.x > MAZE_W)) {
          this.score += e.points;
          playWorlukSound();
          e.alive = false;
          if (e._halo) { e._halo.destroy(); e._halo = null; }
          e.destroy(); return;
        }
      }
      return;
    }

    if (this.isCentered(e) || e.dir === DIR.NONE || !this.canMove(e.gridCol, e.gridRow, e.dir)) {
      e.x = e.gridCol * CELL + CELL/2;
      e.y = e.gridRow * CELL + CELL/2;

      let opts = this.validDirs(e.gridCol, e.gridRow);
      const back = this.opposite(e.dir);
      const forward_opts = opts.filter(d => d !== back);
      const use_opts = forward_opts.length > 0 ? forward_opts : opts;

      let chosen_dir = null;
      if (this.player && this.player.alive && Math.random() < 0.65) {
        const dx = this.player.x - e.x;
        const dy = this.player.y - e.y;
        const preferred = Math.abs(dx) > Math.abs(dy)
          ? (dx < 0 ? DIR.LEFT : DIR.RIGHT)
          : (dy < 0 ? DIR.UP : DIR.DOWN);
        if (use_opts.includes(preferred)) { chosen_dir = preferred; }
      }
      e.dir = chosen_dir || (use_opts.length ? Phaser.Math.RND.pick(use_opts) : Phaser.Math.RND.pick([DIR.LEFT, DIR.RIGHT, DIR.UP, DIR.DOWN]));
      if (e.dir === DIR.NONE) { e.dir = Phaser.Math.RND.pick([DIR.LEFT, DIR.RIGHT, DIR.UP, DIR.DOWN]); }
    }

    e.fireTimer -= dt * 1000;
    if (e.fireTimer <= 0) {
      e.fireTimer = Phaser.Math.Between(2500, 6000);
      if (this.player && e.type !== 'wizard') this.spawnEnemyBullet(e);
    }
  }

  isCentered(e) {
    const cx = e.gridCol * CELL + CELL/2;
    const cy = e.gridRow * CELL + CELL/2;
    return Math.abs(e.x - cx) < 2 && Math.abs(e.y - cy) < 2;
  }

  canMove(c, r, dir) {
    const d = DVEC[dir];
    const nc = c + d.x, nr = r + d.y;
    if (nr >= 0 && nr < ROWS && (nc < 0 || nc >= COLS)) return [(ROWS/2-1)|0, (ROWS/2)|0].includes(nr);
    return !isWall(this.maze, nc, nr);
  }

  validDirs(c, r) {
    const out = [];
    [DIR.LEFT, DIR.RIGHT, DIR.UP, DIR.DOWN].forEach(d => {
      if (this.canMove(c, r, d)) out.push(d);
    });
    return out;
  }

  opposite(d) {
    return { [DIR.LEFT]: DIR.RIGHT, [DIR.RIGHT]: DIR.LEFT, [DIR.UP]: DIR.DOWN, [DIR.DOWN]: DIR.UP, [DIR.NONE]: DIR.NONE }[d];
  }

  findOpenCell(maze, c, r) {
    return findOpenCell(maze, c, r);
  }

  spawnEntity(key, x, y, props) {
    const img = this.add.image(x, y, key);
    img.setDisplaySize(CELL - 6, CELL - 6);
    Object.assign(img, props);
    img.gridCol = Math.floor(x / CELL);
    img.gridRow = Math.floor(y / CELL);
    img.moveCooldown = 0;
    this.entityLayer.add(img);
    return img;
  }

  spawnEnemy(type, x, y) {
    const cfg = {
      burwor: { speed: 55, visible: 1, points: 100 },
      garwor: { speed: 75, visible: 0.6, points: 200, fades: true },
      thorwor: { speed: 95, visible: 0, points: 500, invisible: true },
      worluk: { speed: 140, visible: 1, points: 1000, flees: true },
      wizard: { speed: 90, visible: 1, points: 2500, teleports: true }
    }[type];

    const fleeRight = type === 'worluk' ? (x < MAZE_W/2) : false;
    const e = this.spawnEntity(type, x, y, {
      type, alive: true,
      baseSpeed: cfg.speed,
      speed: cfg.speed,
      dir: Phaser.Math.RND.pick([DIR.LEFT, DIR.RIGHT, DIR.UP, DIR.DOWN]),
      points: cfg.points,
      fades: cfg.fades || false,
      invisible: cfg.invisible || false,
      flees: cfg.flees || false,
      teleports: cfg.teleports || false,
      fireTimer: Phaser.Math.Between(2000, 6000),
      teleportTimer: type === 'wizard' ? Phaser.Math.Between(3000, 5000) : 0,
      escapeTimer: type === 'worluk' ? 1200 : 0,
      fleeRight
    });

    e._isTopView = (type === 'burwor' || type === 'garwor' || type === 'thorwor' || type === 'worluk');

    const arcadeColors = {
      burwor: 0x2244cc, garwor: 0xddaa00, thorwor: 0xcc2222,
      worluk: 0xddaa00, wizard: 0x2244cc
    };

    const halo = this.add.circle(x, y, CELL * 0.45, arcadeColors[type] || 0xffffff, 0.22);
    this.entityLayer.add(halo);
    halo.setDepth(e.depth - 1);
    e._halo = halo;

    if (type === 'worluk') { e.dir = fleeRight ? DIR.RIGHT : DIR.LEFT; playWorlukSound(); }
    if (type === 'wizard') { playWizardTaunt(); }

    if (cfg.invisible) e.setAlpha(0);
    else if (cfg.fades) e.setAlpha(cfg.visible);

    this.enemies.push(e);
    return e;
  }

  clearAll() {
    this.entityLayer.removeAll(true);
    this.bullets = [];
    this.enemyBullets = [];
    this.enemies = [];
    this.player = null;
    this.player2 = null;
    this.worlukSpawned = false;
    this.wizardSpawned = false;
    this.dungeonStartTime = 0;
    this.backupActive = false;
    this.backupTimer = 0;
    if (this.backupGroup) { this.backupGroup.destroy(); this.backupGroup = null; }
  }

  drawMaze() {
    const g = this.mazeGfx;
    g.clear();

    // Floor
    g.fillStyle(0x0a0a1a, 1);
    g.fillRect(0, 0, MAZE_W, MAZE_H);

    // Walls with color cycling (arcade accurate)
    const wallColor = WALL_COLORS[this.level % 5];
    const lighterColor = WALL_COLORS[(this.level + 1) % 5];

    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (this.maze[r][c] === 1) {
          g.fillStyle(wallColor, 1);
          g.fillRect(c * CELL, r * CELL, CELL, CELL);
          g.fillStyle(lighterColor, 0.5);
          g.fillRect(c * CELL + 3, r * CELL + 3, CELL - 6, CELL - 6);
          g.fillStyle(0xffffff, 0.3);
          g.fillRect(c * CELL + 3, r * CELL + 3, 3, 3);
          g.fillRect(c * CELL + CELL - 6, r * CELL + 3, 3, 3);
          g.fillRect(c * CELL + 3, r * CELL + CELL - 6, 3, 3);
          g.fillRect(c * CELL + CELL - 6, r * CELL + CELL - 6, 3, 3);
        }
      }
    }

    // Warp tunnels (pulsing purple)
    const midR1 = (ROWS/2-1)|0, midR2 = (ROWS/2)|0;
    const tunnelPulse = 0.5 + 0.5 * Math.sin(performance.now() / 400);
    [midR1, midR2].forEach(r => {
      g.fillStyle(0xff00ff, tunnelPulse);
      g.fillRect(0, r * CELL, CELL, CELL);
      g.fillStyle(0xff44ff, 0.8);
      g.fillRect(CELL - 3, r * CELL, 3, CELL);
      g.fillStyle(0xff44ff, 0.8);
      g.fillRect(MAZE_W - CELL, r * CELL, 3, CELL);
    });
  }

  drawRadar() {
    const g = this.radarGfx;
    g.clear();
    const y0 = MAZE_H;
    g.fillStyle(0x0a0a1a, 1);
    g.fillRect(0, y0, MAZE_W, RADAR_H);
    g.lineStyle(2, 0x00ff88, 0.7);
    g.strokeRect(8, y0 + 8, MAZE_W - 16, RADAR_H - 16);

    if (!this._radarTxt) {
      this._radarTxt = this.add.text(14, y0 + 10, 'RADAR', { fontFamily: 'Press Start 2P', fontSize: '10px', color: '#00ff88' });
    }

    const ix = 16, iy = y0 + 20;
    const iw = MAZE_W - 32, ih = RADAR_H - 30;
    const sx = iw / MAZE_W, sy = ih / MAZE_H;

    g.lineStyle(1, 0x1a2a3a, 0.5);
    for (let r = 0; r <= ROWS; r++) {
      g.lineBetween(ix, iy + r * (ih / ROWS), ix + iw, iy + r * (ih / ROWS));
    }
    for (let c = 0; c <= COLS; c++) {
      g.lineBetween(ix + c * (iw / COLS), iy, ix + c * (iw / COLS), iy + ih);
    }

    // Player 1 (yellow)
    if (this.player && this.player.alive) {
      g.fillStyle(0xffea00, 1);
      g.fillRect(ix + this.player.x * sx - 3, iy + this.player.y * sy - 3, 6, 6);
    }

    // Player 2 (cyan)
    if (this.player2 && this.player2.alive) {
      g.fillStyle(0x44ffff, 1);
      g.fillRect(ix + this.player2.x * sx - 3, iy + this.player2.y * sy - 3, 6, 6);
    }

    // Enemies
    this.enemies.forEach(e => {
      if (!e.alive) return;
      const cm = {
        burwor: 0x2244cc, garwor: 0xddaa00, thorwor: 0xcc2222,
        worluk: 0xddaa00, wizard: 0xff00ff
      };
      g.fillStyle(cm[e.type] || 0xffffff, 1);
      g.fillRect(ix + e.x * sx - 3, iy + e.y * sy - 3, 6, 6);
    });

    // Backup warrior (white)
    if (this.backupActive && this.backupGroup) {
      g.fillStyle(0xffffff, 1);
      g.fillRect(ix + this.backupX * sx - 3, iy + this.backupY * sy - 3, 6, 6);
    }

    this.radarSweepAngle = (this.radarSweepAngle || 0) + 0.04;
    const rcx = ix + iw / 2;
    const rcy = iy + ih / 2;
    const radius = Math.max(iw, ih) / 2;
    g.lineStyle(2, 0x00ff88, 0.35);
    g.lineBetween(rcx, rcy, rcx + Math.cos(this.radarSweepAngle) * radius, rcy + Math.sin(this.radarSweepAngle) * radius);
  }

  updateHUD() {
    this.hudGfx.clear();
    const g = this.hudGfx;

    // Top bar background
    g.fillStyle(0x111133, 0.85);
    g.fillRect(0, 0, GAME_W, 32);

    // Score (yellow, left)
    this.add.text(8, 6, 'SCORE: ' + formatScore(this.score), {
      fontFamily: 'Press Start 2P', fontSize: '9px', color: '#ffea00'
    });

    // Player 1 lives (blue, center-left)
    let p1str = '';
    for (let i = 0; i < this.p1Lives; i++) p1str += '\u25C8 ';
    this.add.text(280, 8, 'P1 ' + p1str.trim(), {
      fontFamily: 'Press Start 2P', fontSize: '8px', color: '#4488ff'
    });

    // Player 2 lives (red, center)
    let p2str = '';
    for (let i = 0; i < this.p2Lives; i++) p2str += '\u25C6 ';
    this.add.text(480, 8, 'P2 ' + p2str.trim(), {
      fontFamily: 'Press Start 2P', fontSize: '8px', color: '#ff4444'
    });

    // Level (green, right)
    this.add.text(GAME_W - 150, 6, 'DUNGEON ' + this.level, {
      fontFamily: 'Press Start 2P', fontSize: '9px', color: '#00ff88'
    });

    // High score indicator
    const hs = getHighScores();
    if (hs.length > 0) {
      this.add.text(GAME_W - 150, 20, 'HI: ' + formatScore(hs[0].score), {
        fontFamily: 'Press Start 2P', fontSize: '7px', color: '#ff00ff'
      });
    }
  }

  drawCRT() {
    const g = this.crtGfx;
    g.clear();

    // Scanlines
    for (let y = 0; y < GAME_H; y += 3) {
      g.fillStyle(0x000000, 0.12);
      g.fillRect(0, y, GAME_W, 1);
    }

    // Vignette (darken corners)
    for (let y = 0; y < 80; y += 2) {
      const alpha = Math.min(0.3, y / 80 * 0.3);
      g.fillStyle(0x000000, alpha);
      g.fillRect(0, y, GAME_W, 2);
      g.fillRect(0, GAME_H - y - 2, GAME_W, 2);
    }
    for (let x = 0; x < 80; x += 2) {
      const alpha = Math.min(0.3, x / 80 * 0.3);
      g.fillStyle(0x000000, alpha);
      g.fillRect(x, 0, 2, GAME_H);
      g.fillRect(GAME_W - x - 2, 0, 2, GAME_H);
    }
  }

  showTaunt() {
    if (this.tauntDisplay) this.tauntDisplay.destroy();
    const taunts = [
      "WARRIOR... THE WIZARD OF WOR!",
      "YOU CANNOT DEFEAT ME!",
      "I AM THE WIZARD OF WOR!",
      "YOUR WORST NIGHTMARE!",
      "HUNT ME IF YOU DARE!",
      "THE WIZARD IS WATCHING!",
      "YOU WILL NEVER CATCH ME!"
    ];
    this.tauntDisplay = this.add.text(MAZE_W/2, MAZE_H*0.15, taunts[Math.floor(Math.random()*taunts.length)], {
      fontFamily: 'Press Start 2P', fontSize: '12px', color: '#ff00ff',
      stroke: '#000000', strokeThickness: 4
    }).setOrigin(0.5).setDepth(200);
    this.tweens.add({
      targets: this.tauntDisplay,
      alpha: 0, y: MAZE_H*0.15 - 30,
      duration: 2500,
      onComplete: () => { this.tauntDisplay = null; }
    });
  }

  tryFire() {
    if (this.state !== 'playing' || !this.player || !this.player.alive) return;
    this.bullets.forEach(b => b.destroy()); this.bullets = [];

    const d = this.player.dir === DIR.NONE ? (this.player.queuedDir || DIR.RIGHT) : this.player.dir;
    const vec = DVEC[d];
    if (!vec || (vec.x === 0 && vec.y === 0)) return;

    const b = this.add.image(this.player.x + vec.x * 16, this.player.y + vec.y * 16, 'bullet');
    b.vx = vec.x * 400; b.vy = vec.y * 400;
    if (vec.y !== 0) b.angle = 90;
    this.entityLayer.add(b); this.bullets.push(b);
    playShootSound();
  }

  tryFireP2() {
    if (this.state !== 'playing' || !this.player2 || !this.player2.alive) return;
    this.enemyBullets.forEach(b => b.destroy()); this.enemyBullets = []; // Clean up enemy bullets for P2? No, keep them.

    const d = this.player2.dir === DIR.NONE ? (this.player2.queuedDir || DIR.RIGHT) : this.player2.dir;
    const vec = DVEC[d];
    if (!vec || (vec.x === 0 && vec.y === 0)) return;

    const b = this.add.image(this.player2.x + vec.x * 16, this.player2.y + vec.y * 16, 'bullet');
    b.vx = vec.x * 400; b.vy = vec.y * 400;
    if (vec.y !== 0) b.angle = 90;
    this.entityLayer.add(b); this.bullets.push(b);
    playShootSound();
  }

  handleBulletCollisions() {
    for (let i = this.bullets.length - 1; i >= 0; i--) {
      const b = this.bullets[i];
      let hit = false;

      for (const e of this.enemies) {
        if (!e.alive) continue;
        if (Phaser.Math.Distance.Between(b.x, b.y, e.x, e.y) < 22) {
          const isDoubleScore = this.worlukSpawned && !this.wizardSpawned;
          const pointsAwarded = (isDoubleScore && e.type === 'worluk') ? (e.points * 2) : e.points;
          this.score += pointsAwarded;
          this.explodeAt(e.x, e.y, pointsAwarded);

          if (isDoubleScore && e.type === 'worluk') {
            const doubleTxt = this.add.text(MAZE_W/2, MAZE_H/2 - 50, 'DOUBLE SCORE BONUS!', {
              fontFamily: 'Press Start 2P', fontSize: '16px', color: '#ffea00'
            }).setOrigin(0.5).setDepth(200);
            this.tweens.add({ targets: doubleTxt, scale: 1.3, alpha: 0, duration: 1500, onComplete: () => doubleTxt.destroy() });
          }

          e.alive = false;
          if (e._halo) { e._halo.destroy(); e._halo = null; }
          e.destroy();
          hit = true; break;
        }
      }

      if (!hit) {
        for (let j = this.enemyBullets.length - 1; j >= 0; j--) {
          const eb = this.enemyBullets[j];
          if (Phaser.Math.Distance.Between(b.x, b.y, eb.x, eb.y) < 12) {
            eb.destroy(); this.enemyBullets.splice(j, 1); hit = true; break;
          }
        }
      }

      if (hit) { b.destroy(); this.bullets.splice(i, 1); }
    }
  }

  explodeAt(x, y, points) {
    if (points) {
      const txt = this.add.text(x, y - 16, '+' + points, {
        fontFamily: 'Press Start 2P', fontSize: '11px', color: '#ffea00'
      });
      txt.setOrigin(0.5); txt.setDepth(100);
      this.tweens.add({ targets: txt, y: y - 48, alpha: 0, duration: 650, onComplete: () => txt.destroy() });
    }

    const exp = this.add.image(x, y, 'explosion');
    exp.setDisplaySize(CELL, CELL);
    this.entityLayer.add(exp);
    this.tweens.add({
      targets: exp, scale: 0, alpha: 0, duration: 400,
      onComplete: () => exp.destroy()
    });

    playExplosionSound();
  }

  killCurrentPlayer(entity, who) {
    if (this.state !== 'playing') return;
    this.state = 'dying';
    this.explodeAt(entity.x, entity.y);
    playHurtSound();
    entity.alive = false;
    entity.setVisible(false);

    if (who === 'p1') this.p1Lives--; else this.p2Lives--;
    this.updateHUD();

    const isLastLife = (who === 'p1' && this.p1Lives <= 0) || (who === 'p2' && this.p2Lives <= 0);

    if (isLastLife) {
      // Last life for this player — trigger game over
      this.state = 'gameover';
      this.showCRT = false;
      saveScore(this.score, this.level);
      const hs = getHighScores();
      const isNewHigh = hs[0] && hs[0].score === this.score;

      const overlay = this.add.container(0, 0).setDepth(200);
      overlay.setSize(MAZE_W, GAME_H);
      const bg = this.add.rectangle(MAZE_W/2, MAZE_H/2, MAZE_W, GAME_H, 0x000000, 0.95);
      overlay.add(bg);

      this.add.text(MAZE_W/2, MAZE_H*0.25, 'GAME OVER', {
        fontFamily: 'Press Start 2P', fontSize: '26px', color: '#ff0000'
      }).setOrigin(0.5).setDepth(201);
      this.tweens.add({ targets: overlay.children[0], scale: 1.05, duration: 1000, yoyo: true, repeat: -1 });

      this.add.text(MAZE_W/2, MAZE_H*0.45, 'SCORE: ' + formatScore(this.score), {
        fontFamily: 'Press Start 2P', fontSize: '14px', color: '#ffea00'
      }).setOrigin(0.5).setDepth(201);

      this.add.text(MAZE_W/2, MAZE_H*0.55, 'LEVEL: ' + this.level, {
        fontFamily: 'Press Start 2P', fontSize: '11px', color: '#00ff88'
      }).setOrigin(0.5).setDepth(201);

      if (isNewHigh) {
        this.add.text(MAZE_W/2, MAZE_H*0.68, 'NEW HIGH SCORE!', {
          fontFamily: 'Press Start 2P', fontSize: '14px', color: '#ff00ff'
        }).setOrigin(0.5).setDepth(201);
      }

      const restart = this.add.text(MAZE_W/2, MAZE_H*0.85, 'TAP OR PRESS ANY KEY', {
        fontFamily: 'Press Start 2P', fontSize: '10px', color: '#ffea00'
      }).setOrigin(0.5).setDepth(201);
      this.tweens.add({ targets: restart, alpha: 0.3, duration: 600, yoyo: true, repeat: -1 });
      return;
    }

    // Not last life — respawn this player at reserve position
    this.backupPlayer = who;
    const safe = this.findOpenCell(this.maze, (COLS/2)|0, ROWS-3) || { c: 1, r: (ROWS/2)|0 };
    const px = safe.c * CELL + CELL/2;
    const py = safe.r * CELL + CELL/2;
    this.backupX = px; this.backupY = py;
    this.backupActive = true;
    this.backupTimer = 10000;
    this.drawBackupBox(px, py, who);

    this.time.delayedCall(1000, () => {
      const target = who === 'p1' ? this.player : this.player2;
      target.x = px; target.y = py;
      target.gridCol = safe.c; target.gridRow = safe.r;
      target.dir = DIR.NONE; target.queuedDir = DIR.NONE;
      target.setVisible(true); target.alive = true;
      this.backupActive = false;
      if (this.backupGroup) { this.backupGroup.destroy(); this.backupGroup = null; }
    });
  }

  drawBackupBox(x, y, who) {
    if (this.backupGroup) this.backupGroup.destroy();
    this.backupGroup = this.add.container(x, y).setDepth(15);
    const box = this.add.image(0, 0, 'backup').setDisplaySize(CELL, CELL);
    this.backupGroup.add(box);
    const color = who === 'p1' ? '#4488ff' : '#ff4444';
    const label = this.add.text(0, -CELL/2 - 8, who === 'p1' ? 'P1' : 'P2', {
      fontFamily: 'Press Start 2P', fontSize: '8px', color: color
    }).setOrigin(0.5);
    this.backupGroup.add(label);
    const timerTxt = this.add.text(0, 0, '10', {
      fontFamily: 'Press Start 2P', fontSize: '10px', color: '#ffaa00'
    }).setOrigin(0.5);
    this.backupGroup.add(timerTxt);

    const glow = this.add.circle(0, 0, CELL * 0.5, 0xffaa00, 0.3);
    this.backupGroup.add(glow);
  }

  nextLevel() {
    if (this.state !== 'playing') return;
    this.state = 'levelEnd';
    playDungeonClearSound();

    const overlay = this.add.container(0, 0).setDepth(200);
    const bg = this.add.rectangle(MAZE_W/2, MAZE_H/2, MAZE_W, MAZE_H, 0x000000, 0.85);
    overlay.add(bg);

    const isDoubleScore = this.worlukSpawned && !this.wizardSpawned;
    const levelName = (this.level === 6) ? 'THE ARENA' :
      (this.level >= 13 && (this.level - 13) % 6 === 0 ? 'THE PIT' : 'DUNGEON ' + this.level);

    let txt = this.add.text(MAZE_W/2, MAZE_H/2, levelName + (isDoubleScore ? '\nDOUBLE SCORE!' : ''), {
      fontFamily: 'Press Start 2P', fontSize: '14px', color: isDoubleScore ? '#ffea00' : '#00ff88',
      align: 'center', lineSpacing: 14
    }).setOrigin(0.5);
    overlay.add(txt);

    this.tweens.add({ targets: txt, scale: 1.3, duration: 2000, yoyo: true, repeat: 1 });

    this.time.delayedCall(2500, () => {
      overlay.destroy();
      this.level++;
      this.startLevel();
    });
  }

  gameOver() {
    this.state = 'gameover';
    this.showCRT = false;

    saveScore(this.score, this.level);
    const hs = getHighScores();
    const isNewHigh = hs[0] && hs[0].score === this.score;

    const overlay = this.add.container(0, 0).setDepth(200);
    overlay.setSize(MAZE_W, GAME_H);
    const bg = this.add.rectangle(MAZE_W/2, MAZE_H/2, MAZE_W, GAME_H, 0x000000, 0.95);
    overlay.add(bg);

    const title = this.add.text(MAZE_W/2, MAZE_H*0.25, 'GAME OVER', {
      fontFamily: 'Press Start 2P', fontSize: '26px', color: '#ff0000'
    }).setOrigin(0.5);
    overlay.add(title);
    this.tweens.add({ targets: title, scale: 1.1, duration: 1000, yoyo: true, repeat: -1 });

    const scoreTxt = this.add.text(MAZE_W/2, MAZE_H*0.45, 'FINAL SCORE: ' + formatScore(this.score), {
      fontFamily: 'Press Start 2P', fontSize: '12px', color: '#ffea00'
    }).setOrigin(0.5);
    overlay.add(scoreTxt);

    const levelTxt = this.add.text(MAZE_W/2, MAZE_H*0.55, 'REACHED LEVEL: ' + this.level, {
      fontFamily: 'Press Start 2P', fontSize: '10px', color: '#00ff88'
    }).setOrigin(0.5);
    overlay.add(levelTxt);

    const p1livesTxt = this.add.text(MAZE_W/2, MAZE_H*0.63, 'P1 LIVES: ' + this.p1Lives, {
      fontFamily: 'Press Start 2P', fontSize: '9px', color: '#4488ff'
    }).setOrigin(0.5);
    overlay.add(p1livesTxt);

    const p2livesTxt = this.add.text(MAZE_W/2, MAZE_H*0.69, 'P2 LIVES: ' + this.p2Lives, {
      fontFamily: 'Press Start 2P', fontSize: '9px', color: '#ff4444'
    }).setOrigin(0.5);
    overlay.add(p2livesTxt);

    if (isNewHigh) {
      this.add.text(MAZE_W/2, MAZE_H*0.77, 'NEW HIGH SCORE!', {
        fontFamily: 'Press Start 2P', fontSize: '14px', color: '#ff00ff'
      }).setOrigin(0.5).setDepth(201);
    }

    const restart = this.add.text(MAZE_W/2, MAZE_H*0.9, 'TAP OR PRESS ANY KEY', {
      fontFamily: 'Press Start 2P', fontSize: '10px', color: '#ffea00'
    }).setOrigin(0.5);
    overlay.add(restart);
    this.tweens.add({ targets: restart, alpha: 0.3, duration: 600, yoyo: true, repeat: -1 });
  }

  restartFromGameOver() {
    if (window._gameScene) window._gameScene._begin();
  }

  startGame() {
    this.attractMode = false;
    // Destroy attract objects
    if (this.attractTitle) { this.attractTitle.destroy(); this.attractTitle = null; }
    if (this.attractInstr) { this.attractInstr.destroy(); this.attractInstr = null; }
    if (this.attractTap) { this.attractTap.destroy(); this.attractTap = null; }
    if (this.attractHs) { this.attractHs.destroy(); this.attractHs = null; }
    // Destroy decorative enemies
    this.attractDecor.forEach(e => { if (e._halo) e._halo.destroy(); e.destroy(); });
    this.attractDecor = [];

    this.score = 0;
    this.p1Lives = 3;
    this.p2Lives = 3;
    this.level = 1;
    this.updateHUD();
    playDragnetTheme();
    this.startLevel();
  }

  startLevel() {
    this.clearAll();
    this.maze = generateMaze(this.level);
    this.drawMaze();
    playLevelStart();

    const midR = (ROWS/2)|0;

    // Player 1 spawn (bottom center)
    let p1Col = (COLS/2)|0, p1Row = ROWS-3;
    const p1Safe = this.findOpenCell(this.maze, p1Col, p1Row);
    if (p1Safe) { p1Col = p1Safe.c; p1Row = p1Safe.r; }
    const p1x = p1Col * CELL + CELL/2, p1y = p1Row * CELL + CELL/2;
    this.player = this.spawnEntity('player1', p1x, p1y, {
      type: 'player', speed: 120, baseSpeed: 120, dir: DIR.NONE, alive: true
    });

    // Player 2 spawn (reserves, left side)
    let p2Col = 3, p2Row = ROWS-3;
    const p2Safe = this.findOpenCell(this.maze, p2Col, p2Row);
    if (p2Safe) { p2Col = p2Safe.c; p2Row = p2Safe.r; }
    const p2x = p2Col * CELL + CELL/2, p2y = p2Row * CELL + CELL/2;
    this.player2 = this.spawnEntity('player2', p2x, p2y, {
      type: 'player', speed: 120, baseSpeed: 120, dir: DIR.DOWN, alive: true
    });
    this.player2.queuedDir = DIR.DOWN;

    // Player 2 glow (red instead of blue)
    if (this.player2Glow) this.player2Glow.destroy();
    this.player2Glow = this.add.circle(p2x, p2y, CELL * 0.55, 0xff4444, 0.25);
    this.entityLayer.add(this.player2Glow);
    this.player2Glow.setDepth(this.player2.depth - 1);

    // Player 1 glow (blue)
    if (this.playerGlow) this.playerGlow.destroy();
    this.playerGlow = this.add.circle(p1x, p1y, CELL * 0.55, 0x4488ff, 0.25);
    this.entityLayer.add(this.playerGlow);
    this.playerGlow.setDepth(this.player.depth - 1);

    // Enemies (max 6 on screen, arcade accurate)
    const enemyCount = Math.min(6 + this.level, 10);
    const types = [];
    for (let i = 0; i < enemyCount; i++) {
      const r = Math.random();
      if (this.level >= 3 && r < 0.2) types.push('thorwor');
      else if (this.level >= 2 && r < 0.45) types.push('garwor');
      else types.push('burwor');
    }

    const sp = [[2, 2], [2, 6], [2, 10], [2, 14], [2, 18], [4, 4], [4, 18], [midR, 2], [midR, COLS-3]];
    types.forEach((t, i) => {
      const p = sp[i % sp.length];
      const safe = this.findOpenCell(this.maze, p[1], p[0]);
      if (!safe) return;
      this.spawnEnemy(t, safe.c * CELL + CELL/2, safe.r * CELL + CELL/2);
    });

    this.worlukSpawned = false;
    this.wizardSpawned = false;
    this.state = 'playing';
    this.dungeonStartTime = this.time.now;
  }
}

// ============================================================
// PHASER CONFIG
// ============================================================

const config = {
  type: Phaser.AUTO,
  parent: 'phaserWrap',
  width: GAME_W,
  height: GAME_H,
  backgroundColor: '#000',
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  scene: [GameScene]
};

const game = new Phaser.Game(config);

</script>
