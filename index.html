<script>
// ============================================================
// WIZARD OF WOR — Pixel-Art Arcade Recreation
// Faithful to the 1981 Midway arcade original
// ============================================================

const COLS = 22, ROWS = 14, CELL = 48;
const MAZE_W = COLS * CELL, MAZE_H = ROWS * CELL;
const RADAR_H = 64;
const GAME_W = MAZE_W, GAME_H = MAZE_H + RADAR_H;

const DIR = { NONE:0, LEFT:1, RIGHT:2, UP:3, DOWN:4 };
const DVEC = {
  [DIR.LEFT]:{x:-1,y:0}, [DIR.RIGHT]:{x:1,y:0},
  [DIR.UP]:{x:0,y:-1},   [DIR.DOWN]:{x:0,y:1}, [DIR.NONE]:{x:0,y:0}
};

// ============================================================
// PIXEL ART DRAWING ENGINE
// ============================================================

function createPixelSprite(pixels, scale) {
  const rows = pixels.length;
  const cols = pixels[0].length;
  const w = cols * scale;
  const h = rows * scale;
  const g = new Phaser.Game.Graphics();
  g.setSize(w, h);
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const p = pixels[r][c];
      if (p && p !== '.' && p !== ' ') {
        const color = p === '#' ? 0xffffff : parseInt(p.slice(1), 16);
        g.fillStyle(color, 1);
        g.fillRect(c * scale, r * scale, scale, scale);
      }
    }
  }
  return g;
}

// All sprite pixel maps (8-bit style, arcade-accurate)
// Each map is a grid: '#' = pixel color, '.' = transparent
// Colors defined separately per sprite

function drawPlayerSprite(scene) {
  // Top-down space warrior — body + helmet + gun
  const g = scene.make.graphics({x:0, y:0, add:false});
  const s = 4; // pixel scale
  // Body (blue suit)
  g.fillStyle(0x0044aa, 1);
  g.fillRect(s, s, 6*s, 8*s); // torso
  g.fillRect(2*s, 9*s, 4*s, 3*s); // legs
  // Helmet (silver)
  g.fillStyle(0xaaaaaa, 1);
  g.fillRect(2*s, 0, 4*s, 3*s); // helmet
  g.fillRect(0, 2*s, 2*s, 2*s); // helmet sides
  g.fillRect(6*s, 2*s, 2*s, 2*s);
  // Visor (red)
  g.fillStyle(0xff2222, 1);
  g.fillRect(2*s, 2*s, 4*s, s);
  // Gun (right hand)
  g.fillStyle(0x888888, 1);
  g.fillRect(7*s, 3*s, s, 4*s);
  // Helmet antenna
  g.fillStyle(0xffaa00, 1);
  g.fillRect(3*s, -s, 2*s, s);
  g.generateTexture('player', (8)*s, (12)*s);
  g.destroy();
  return 'player';
}

function drawBurworSprite(scene) {
  // Burwor: Wolf-type, blue, always visible
  const g = scene.make.graphics({x:0, y:0, add:false});
  const s = 4;
  // Body (blue wolf)
  g.fillStyle(0x2244cc, 1);
  g.fillRect(2*s, 2*s, 4*s, 6*s); // body
  g.fillRect(0, 4*s, 2*s, 4*s); // left side
  g.fillRect(6*s, 4*s, 2*s, 4*s); // right side
  // Head (darker blue)
  g.fillStyle(0x1122aa, 1);
  g.fillRect(1*s, 0, 6*s, 3*s); // head
  // Eyes (white)
  g.fillStyle(0xffffff, 1);
  g.fillRect(2*s, s, s, s);
  g.fillRect(5*s, s, s, s);
  // Legs
  g.fillStyle(0x2244cc, 1);
  g.fillRect(1*s, 8*s, 2*s, 2*s);
  g.fillRect(5*s, 8*s, 2*s, 2*s);
  // Tail
  g.fillStyle(0x1122aa, 1);
  g.fillRect(0, 7*s, s, 2*s);
  g.generateTexture('burwor', (8)*s, (10)*s);
  g.destroy();
  return 'burwor';
}

  // Eyes (red)

  g.fillRect(2*s, s, s, s);
  g.fillRect(5*s, s, s, s);
  // Legs

  g.fillRect(1*s, 8*s, 2*s, 2*s);
  g.fillRect(5*s, 8*s, 2*s, 2*s);
  // Tail

  g.fillRect(0, 6*s, s, 2*s);
  g.fillRect(0, 7*s, 2*s, s);
  g.generateTexture('garwor', (8)*s, (10)*s);
  g.destroy();
  return 'garwor';
}

  g.fillRect(2*s, s, s, s);

  g.fillRect(0, 5*s, 2*s, s);
  g.fillRect(6*s, 5*s, 2*s, s);
  g.fillRect(1*s, 7*s, 2*s, 2*s);
  g.fillRect(5*s, 7*s, 2*s, 2*s);
  g.generateTexture('thorwor', (9)*s, (10)*s);
  g.destroy();

}

}

  g.destroy();

}

  g.destroy();
  return 'backup';
}

// ============================================================
// AUDIO ENGINE (Web Audio API — no external files needed)
// ============================================================

let audioCtx = null;
function getAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function playDragnetTheme() {
  // 5-note Dragnet opening (C, G, C, G, C)
  try {
    const ctx = getAudio();
    const notes = [261.63, 392.00, 523.25, 392.00, 523.25];
    const now = ctx.currentTime;
    notes.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'square';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.15, now + i * 0.2);
      gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.2 + 0.18);
      osc.connect(gain).connect(ctx.destination);
      osc.start(now + i * 0.2);
      osc.stop(now + i * 0.2 + 0.2);
    });
  } catch(e) {}
}

function playShootSound() {
  try {
    const ctx = getAudio();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(800, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(200, ctx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.12, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
    osc.connect(gain).connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.1);
  } catch(e) {}
}

function playExplosionSound() {
  try {
    const ctx = getAudio();
    const bufferSize = ctx.sampleRate * 0.3;
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2);
    }
    const source = ctx.createBufferSource();
    const gain = ctx.createGain();
    source.buffer = buffer;
    gain.gain.setValueAtTime(0.2, ctx.currentTime);
    source.connect(gain).connect(ctx.destination);
    source.start();
  } catch(e) {}
}

function playWizardTaunt() {
  try {
    const ctx = getAudio();
    const taunts = [
      [200, 300, 200, 400, 200],
      [150, 250, 350, 250, 150],
      [300, 200, 400, 200, 300]
    ];
    const taunt = taunts[Math.floor(Math.random() * taunts.length)];
    const now = ctx.currentTime;
    taunt.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = i % 2 === 0 ? 'square' : 'sawtooth';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.08, now + i * 0.12);
      gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.12 + 0.1);
      osc.connect(gain).connect(ctx.destination);
      osc.start(now + i * 0.12);
      osc.stop(now + i * 0.12 + 0.11);
    });
  } catch(e) {}
}

// Speech synthesis for Wizard taunts
function speakRobotic(text) {
  if (!window.speechSynthesis) return;
  try {
    const utter = new SpeechSynthesisUtterance(text);
    utter.pitch = 0.3;
    utter.rate = 0.7;
    utter.volume = 0.8;
    speechSynthesis.speak(utter);
  } catch(e) {}
}

// ============================================================
// MAZE GENERATION (faithful to arcade)
// ============================================================

function generateMaze(level) {
  const g = [];
  for (let r = 0; r < ROWS; r++) {
    g.push([]);
    for (let c = 0; c < COLS; c++) g[r].push(0);
  }
  // Outer border
  for (let c = 0; c < COLS; c++) { g[0][c] = 1; g[ROWS-1][c] = 1; }
  for (let r = 0; r < ROWS; r++) { g[r][0] = 1; g[r][COLS-1] = 1; }
  // Warp openings on two middle rows
  const m1 = (ROWS/2-1)|0, m2 = (ROWS/2)|0;
  g[m1][0] = 0; g[m1][COLS-1] = 0; g[m2][0] = 0; g[m2][COLS-1] = 0;

  // Deterministic PRNG seeded by level
  let seed = level * 7919 + 13;
  function rnd() { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }

  const halfC = (COLS/2)|0;
  const halfR = (ROWS/2)|0;

  function paintCell(r, c, v) {
    if (r <= 0 || r >= ROWS-1 || c <= 0 || c >= COLS-1) return;
    g[r][c] = v;
    g[ROWS-1-r][c] = v;
    g[r][COLS-1-c] = v;
    g[ROWS-1-r][COLS-1-c] = v;
  }

  // Maze density decreases with level (arcade accurate)
  const wallChance = Math.max(0.25, 0.50 - level * 0.025);
  const stickChance = Math.max(0.30, 0.65 - level * 0.025);

  for (let r = 2; r < halfR; r += 2) {
    for (let c = 2; c < halfC; c += 2) {
      const k = rnd();
      if (k < wallChance) {
        const len = (rnd() < 0.55) ? 2 : 1;
        for (let i = 0; i < len && r + i < halfR; i++) paintCell(r+i, c, 1);
      } else if (k < stickChance) {
        paintCell(r, c, 1);
        if (c+1 < halfC) paintCell(r, c+1, 1);
      } else if (k < stickChance + 0.13) {
        paintCell(r, c, 1);
      }
    }
  }

  // Clear warp row
  for (let c = 1; c < COLS-1; c++) g[m1][c] = 0;
  for (let c = 1; c < COLS-1; c++) {
    if (g[m2][c] === 1 && rnd() < 0.6) g[m2][c] = 0;
  }

  // Special dungeons: The Arena (level 6) and The Pit (level 13, 19, 25...)
  const isPit = (level >= 13 && (level - 13) % 6 === 0);
  const isArena = (level === 6);

  if (isArena) {
    // Wide open space — remove center walls
    for (let r = 3; r < 11; r++) {
      for (let c = 5; c < 17; c++) {
        g[r][c] = 0;
      }
    }
  }

  if (isPit) {
    // Very few walls — high danger
    for (let r = 2; r < ROWS-2; r += 2) {
      for (let c = 2; c < COLS-2; c += 2) {
        if (rnd() < 0.15) paintCell(r, c, 1);
      }
    }
  }

  // Guarantee player + spawn cells are open
  const startR = ROWS-3, startC = (COLS/2)|0;
  paintCell(startR, startC, 0);
  paintCell(startR, startC-1, 0);
  paintCell(2, 2, 0); paintCell(2, 4, 0); paintCell(2, 6, 0);
  paintCell(2, halfC-1, 0); paintCell(2, halfC, 0);

  return g;
}

function isWall(maze, c, r) {
  if (r < 0 || r >= ROWS) return true;
  if (c < 0 || c >= COLS) return false;
  return maze[r][c] === 1;
}

function findOpenCell(maze, c, r) {
  if (!isWall(maze, c, r) && r >= 0 && r < ROWS && c >= 0 && c < COLS) return {c, r};
  const seen = new Set();
  const key = (cc, rr) => rr * COLS + cc;
  const q = [[c, r]]; seen.add(key(c, r));
  while (q.length) {
    const [cc, rr] = q.shift();
    if (rr > 0 && rr < ROWS-1 && cc > 0 && cc < COLS-1 && !isWall(maze, cc, rr)) return {c:cc, r:rr};
    [[0,-1],[0,1],[-1,0],[1,0]].forEach(([dc, dr]) => {
      const nk = key(cc+dc, rr+dr);
      if (!seen.has(nk) && cc+dc >= 0 && cc+dc < COLS && rr+dr >= 0 && rr+dr < ROWS) {
        seen.add(nk); q.push([cc+dc, rr+dr]);
      }
    });
  }
  return null;
}

// ============================================================
// GAME SCENE
// ============================================================

class GameScene extends Phaser.Scene {
  constructor() { super('game'); }

  preload() {
    // No external assets — all procedural pixel art
  }

  create() {
    window._gameScene = this;
    this.cameras.main.setBackgroundColor('#000');

    // Draw all pixel art sprites
    drawPlayerSprite(this);
    drawBurworSprite(this);
    drawGarworSprite(this);
    drawThorworSprite(this);
    drawWorlukSprite(this);
    drawWizardSprite(this);
    drawBulletSprite(this);
    drawEnemyBulletSprite(this);
    drawExplosionSprite(this);
    drawBackupBoxSprite(this);

    // Score
    this.score = 0; this.lives = 3; this.level = 1; this.state = 'idle';
    this.bullets = []; this.enemyBullets = []; this.player = null; this.enemies = [];
    this.maze = null; this.mazeGfx = this.add.graphics();
    this.mazeTiles = this.add.container(0, 0); this.mazeTiles.setDepth(0);
    this.entityLayer = this.add.container(0, 0); this.entityLayer.setDepth(10);
    this.radarGfx = this.add.graphics(); this.radarGfx.setDepth(20);

    // 4-way controls
    this.cursors = this.input.keyboard.createCursorKeys();
    this.spaceKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);
    this.spaceKey.on('down', () => this.tryFire());

    // Touch controls
    this.touchDir = DIR.NONE; this.queuedDir = DIR.NONE;
    this.fireDir = DIR.NONE;

    // Speed-up tracking
    this.dungeonStartTime = 0;
    this.speedUpInterval = 7000; // 7 seconds (arcade accurate)

    // Backup warrior
    this.backupActive = false; this.backupTimer = 0; this.backupX = 0; this.backupY = 0;
    this.backupGroup = null;

    this.updateHUD();

    // Touch input
    this.setupTouchInput();
  }

  setupTouchInput() {
    const gameArea = document.getElementById('gameContainer');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');

    startBtn.addEventListener('click', () => {
      startBtn.blur();
      startBegin();
    });
    startBtn.addEventListener('touchend', e => { e.preventDefault(); startBegin(); });

    restartBtn.addEventListener('click', () => {
      restartBtn.blur();
      document.getElementById('gameOverScreen').classList.add('hidden');
      if (window._gameScene && window._gameScene._begin) window._gameScene._begin();
    });
    restartBtn.addEventListener('touchend', e => { e.preventDefault(); restartBtn.blur(); document.getElementById('gameOverScreen').classList.add('hidden'); if (window._gameScene && window._gameScene._begin) window._gameScene._begin(); });

    // Touch D-pad (left side) + fire button (right side)
    const dpad = this.add.container(0, 0).setDepth(100);
    dpad.setScrollFactor(0);

    // D-pad arrows
    const arrowSize = 50;
    const arrowColor = 0x00ff88;
    const arrowAlpha = 0.3;

    // Up
    const upBtn = this.add.rectangle(80, GAME_H - 120, arrowSize, arrowSize, arrowColor, arrowAlpha)
      .setInteractive({ useHandCursor: true }).setScrollFactor(0);
    this.add.text(80, GAME_H - 120, '▲', { fontFamily: 'Press Start 2P', fontSize: '20px', color: '#00ff88' })
      .setOrigin(0.5).setScrollFactor(0);
    upBtn.on('pointerdown', () => { this.queuedDir = DIR.UP; this.touchDir = DIR.UP; });
    upBtn.on('pointerup', () => { if (this.touchDir === DIR.UP) this.touchDir = DIR.NONE; });
    upBtn.on('pointerout', () => { if (this.touchDir === DIR.UP) this.touchDir = DIR.NONE; });

    // Down
    const downBtn = this.add.rectangle(80, GAME_H - 30, arrowSize, arrowSize, arrowColor, arrowAlpha)
      .setInteractive({ useHandCursor: true }).setScrollFactor(0);
    this.add.text(80, GAME_H - 30, '▼', { fontFamily: 'Press Start 2P', fontSize: '20px', color: '#00ff88' })
      .setOrigin(0.5).setScrollFactor(0);
    downBtn.on('pointerdown', () => { this.queuedDir = DIR.DOWN; this.touchDir = DIR.DOWN; });
    downBtn.on('pointerup', () => { if (this.touchDir === DIR.DOWN) this.touchDir = DIR.NONE; });
    downBtn.on('pointerout', () => { if (this.touchDir === DIR.DOWN) this.touchDir = DIR.NONE; });

    // Left
    const leftBtn = this.add.rectangle(80 - 65, GAME_H - 75, arrowSize, arrowSize, arrowColor, arrowAlpha)
      .setInteractive({ useHandCursor: true }).setScrollFactor(0);
    this.add.text(80 - 65, GAME_H - 75, '◄', { fontFamily: 'Press Start 2P', fontSize: '20px', color: '#00ff88' })
      .setOrigin(0.5).setScrollFactor(0);
    leftBtn.on('pointerdown', () => { this.queuedDir = DIR.LEFT; this.touchDir = DIR.LEFT; });
    leftBtn.on('pointerup', () => { if (this.touchDir === DIR.LEFT) this.touchDir = DIR.NONE; });
    leftBtn.on('pointerout', () => { if (this.touchDir === DIR.LEFT) this.touchDir = DIR.NONE; });

    // Right
    const rightBtn = this.add.rectangle(80 + 65, GAME_H - 75, arrowSize, arrowSize, arrowColor, arrowAlpha)
      .setInteractive({ useHandCursor: true }).setScrollFactor(0);
    this.add.text(80 + 65, GAME_H - 75, '►', { fontFamily: 'Press Start 2P', fontSize: '20px', color: '#00ff88' })
      .setOrigin(0.5).setScrollFactor(0);
    rightBtn.on('pointerdown', () => { this.queuedDir = DIR.RIGHT; this.touchDir = DIR.RIGHT; });
    rightBtn.on('pointerup', () => { if (this.touchDir === DIR.RIGHT) this.touchDir = DIR.NONE; });
    rightBtn.on('pointerout', () => { if (this.touchDir === DIR.RIGHT) this.touchDir = DIR.NONE; });

    // Fire button (right side)
    const fireBtn = this.add.circle(GAME_W - 70, GAME_H - 70, 45, 0xff0000, 0.3)
      .setInteractive({ useHandCursor: true }).setScrollFactor(0);
    this.add.text(GAME_W - 70, GAME_H - 70, 'FIRE', { fontFamily: 'Press Start 2P', fontSize: '10px', color: '#ff0000' })
      .setOrigin(0.5).setScrollFactor(0);
    fireBtn.on('pointerdown', () => { this.tryFire(); });
  }

  update(time, delta) {
    if (this.state !== 'playing') return;
    const dt = delta / 1000;

    // Track dungeon time for speed-up
    if (this.dungeonStartTime === 0) this.dungeonStartTime = time;
    const elapsed = time - this.dungeonStartTime;
    const speedMultiplier = 1 + Math.floor(elapsed / this.speedUpInterval) * 0.15; // 15% faster every 7s

    this.handleInput();

    // Player movement
    if (this.player && this.player.alive) {
      this.player.speed = 120 * Math.min(speedMultiplier, 3); // Cap at 3x
      this.moveEntity(this.player, dt);
    }

    // Speed up all enemies
    this.enemies.forEach(e => {
      if (!e.alive) return;
      // Apply speed multiplier to base speed
      const baseSpeed = e.baseSpeed || e.speed;
      e.speed = baseSpeed * Math.min(speedMultiplier, 3);
      this.updateEnemyAI(e, dt, time);
      this.moveEntity(e, dt);
    });

    // Bullets
    [this.bullets, this.enemyBullets].forEach((list, isE) => {
      for (let i = list.length - 1; i >= 0; i--) {
        const b = list[i];
        b.x += b.vx * dt; b.y += b.vy * dt;
        const c = Math.floor(b.x / CELL), r = Math.floor(b.y / CELL);
        if (b.x < 0 || b.x > MAZE_W || b.y < 0 || b.y > MAZE_H || isWall(this.maze, c, r)) {
          b.destroy(); list.splice(i, 1);
        }
      }
    });

    this.handleBulletCollisions();

    // Player hit by enemy bullet
    if (this.player && this.player.alive) {
      for (let i = this.enemyBullets.length - 1; i >= 0; i--) {
        const b = this.enemyBullets[i];
        if (Phaser.Math.Distance.Between(b.x, b.y, this.player.x, this.player.y) < 18) {
          b.destroy(); this.enemyBullets.splice(i, 1);
          this.killPlayer(); break;
        }
      }
    }

    // Player contact with enemy
    if (this.player && this.player.alive) {
      for (const e of this.enemies) {
        if (e.alive && Phaser.Math.Distance.Between(e.x, e.y, this.player.x, this.player.y) < 26) {
          this.killPlayer(); break;
        }
      }
    }

    // Backup warrior timer
    if (this.backupActive) {
      this.backupTimer -= dt * 1000;
      if (this.backupTimer <= 0) {
        // Auto-enter backup
        if (this.player && !this.player.alive) {
          this.player.x = this.backupX;
          this.player.y = this.backupY;
          this.player.gridCol = Math.floor(this.backupX / CELL);
          this.player.gridRow = Math.floor(this.backupY / CELL);
          this.player.dir = DIR.NONE;
          this.player.queuedDir = DIR.NONE;
          this.player.setVisible(true);
          this.player.alive = true;
          this.backupActive = false;
          if (this.backupGroup) { this.backupGroup.destroy(); this.backupGroup = null; }
        }
      }
      // Update backup box visual
      if (this.backupGroup) {
        this.backupGroup.children.iterate(child => {
          if (child instanceof Phaser.GameObjects.Text) {
            const secs = Math.ceil(this.backupTimer / 1000);
            child.setText(secs > 0 ? 'BOX ' + secs : '!!');
          }
        });
      }
    }

    // Spawn Worluk after all basic enemies dead
    const rem = this.enemies.filter(e => e.alive && (e.type === 'burwor' || e.type === 'garwor' || e.type === 'thorwor'));
    if (rem.length === 0 && !this.worlukSpawned) {
      this.worlukSpawned = true;
      const m = (ROWS/2)|0;
      const s = this.findOpenCell(this.maze, 1, m);
      if (s) this.spawnEnemy('worluk', s.c*CELL+CELL/2, s.r*CELL+CELL/2);
    }

    // Spawn Wizard after Worluk dead
    const wl = this.enemies.filter(e => e.alive && e.type === 'worluk');
    if (this.worlukSpawned && wl.length === 0 && !this.wizardSpawned) {
      this.wizardSpawned = true;
      if (this.level >= 2 && Math.random() < 0.6) {
        const m = (ROWS/2)|0;
        const s = this.findOpenCell(this.maze, COLS-2, m);
        if (s) this.spawnEnemy('wizard', s.c*CELL+CELL/2, s.r*CELL+CELL/2);
      } else {
        this.nextLevel(); return;
      }
    }

    // Wizard dead → next level
    const wz = this.enemies.filter(e => e.alive && e.type === 'wizard');
    if (this.wizardSpawned && wz.length === 0 && this.state === 'playing') {
      this.nextLevel(); return;
    }

    this.drawRadar();
  }

  handleInput() {
    let d = DIR.NONE;
    if (this.cursors.left.isDown) d = DIR.LEFT;
    else if (this.cursors.right.isDown) d = DIR.RIGHT;
    else if (this.cursors.up.isDown) d = DIR.UP;
    else if (this.cursors.down.isDown) d = DIR.DOWN;
    if (d === DIR.NONE) d = this.touchDir;
    if (d !== DIR.NONE) this.queuedDir = d;
    if (this.player) this.player.queuedDir = this.queuedDir;
  }

  moveEntity(e, dt) {
    const move = e.speed * dt;
    const cx = e.gridCol * CELL + CELL/2;
    const cy = e.gridRow * CELL + CELL/2;

    // Lock perpendicular axis
    if (e.dir === DIR.LEFT || e.dir === DIR.RIGHT) e.y = cy;
    else if (e.dir === DIR.UP || e.dir === DIR.DOWN) e.x = cx;

    if (this.isCentered(e)) {
      e.x = cx; e.y = cy;
      // 4-way joystick: tap to turn, hold to move (arcade style)
      if (e.queuedDir !== undefined && e.queuedDir !== DIR.NONE && this.canMove(e.gridCol, e.gridRow, e.queuedDir)) {
        e.dir = e.queuedDir;
      }
      if (!this.canMove(e.gridCol, e.gridRow, e.dir) && e.type === 'player') return;
    }

    e.x += DVEC[e.dir].x * move;
    e.y += DVEC[e.dir].y * move;

    // Warp tunnels
    if (e.x < -CELL/2) e.x = MAZE_W + CELL/2;
    if (e.x > MAZE_W + CELL/2) e.x = -CELL/2;

    e.gridCol = Math.floor(e.x / CELL);
    e.gridRow = Math.floor(e.y / CELL);
    if (e.gridRow < 0) e.gridRow = 0;
    if (e.gridRow > ROWS-1) e.gridRow = ROWS-1;

    // Rotate top-view sprites
    if (e._isTopView) {
      if (e.dir === DIR.UP) e.angle = 0;
      else if (e.dir === DIR.RIGHT) e.angle = 90;
      else if (e.dir === DIR.DOWN) e.angle = 180;
      else if (e.dir === DIR.LEFT) e.angle = 270;
    } else {
      if (e.dir === DIR.LEFT) e.setFlipX(true);
      if (e.dir === DIR.RIGHT) e.setFlipX(false);
    }

    // Glow halo
    if (e._halo) {
      e._halo.x = e.x; e._halo.y = e.y;
      e._halo.setAlpha(0.18 + 0.10 * Math.sin(performance.now() / 250));
    }
  }

  updateEnemyAI(e, dt, time) {
    // Fade effect for Garwor
    if (e.fades) {
      const a = 0.4 + 0.6 * Math.abs(Math.sin(time / 700));
      e.setAlpha(a);
    }
    // Thorwor: fully invisible in maze (alpha=0), only visible on radar
    if (e.invisible) {
      e.setAlpha(0);
    }

    // Wizard teleporting
    if (e.teleports) {
      e.teleportTimer -= dt * 1000;
      if (e.teleportTimer <= 0) {
        let tries = 30;
        while (tries-- > 0) {
          const c = Phaser.Math.Between(1, COLS-2);
          const r = Phaser.Math.Between(1, ROWS-2);
          if (!this.isWall(this.maze, c, r)) {
            e.gridCol = c; e.gridRow = r;
            e.x = c * CELL + CELL/2; e.y = r * CELL + CELL/2;
            this.tweens.add({ targets: e, alpha: { from: 0, to: 1 }, duration: 200 });
            playWizardTaunt();
            speakRobotic("Find me... The Wizard of Wor!");
            break;
          }
        }
        e.teleportTimer = Phaser.Math.Between(3000, 6000);
      }
    }

    // Worluk: flees to warp doors
    if (e.flees) {
      if (e.escapeTimer > 0) e.escapeTimer = Math.max(0, e.escapeTimer - dt * 1000);
      if (this.isCentered(e)) {
        const opts = this.validDirs(e.gridCol, e.gridRow);
        const midR = (ROWS/2)|0;
        const tx = e.fleeRight ? MAZE_W + CELL : -CELL;
        const ty = midR * CELL + CELL/2;
        opts.sort((a, b) =>
          Phaser.Math.Distance.Between(e.x + DVEC[a].x * CELL, e.y + DVEC[a].y * CELL, tx, ty) -
          Phaser.Math.Distance.Between(e.x + DVEC[b].x * CELL, e.y + DVEC[b].y * CELL, tx, ty)
        );
        if (opts.length) e.dir = opts[0];
        if (e.escapeTimer <= 0 && (e.x < 0 || e.x > MAZE_W)) {
          this.score += e.points; this.updateHUD();
          playWorlukSound(); this.playK('snd_warp');
          e.alive = false; if (e._halo) { e._halo.destroy(); e._halo = null; }
          e.destroy(); return;
        }
      }
      return;
    }

    // Standard enemies: continuous corridor movement + player tracking
    if (this.isCentered(e) || e.dir === DIR.NONE || !this.canMove(e.gridCol, e.gridRow, e.dir)) {
      e.x = e.gridCol * CELL + CELL/2;
      e.y = e.gridRow * CELL + CELL/2;

      let opts = this.validDirs(e.gridCol, e.gridRow);
      const back = this.opposite(e.dir);
      const forward_opts = opts.filter(d => d !== back);
      const use_opts = forward_opts.length > 0 ? forward_opts : opts;

      let chosen_dir = null;
      if (this.player && this.player.alive && Math.random() < 0.65) {
        const dx = this.player.x - e.x;
        const dy = this.player.y - e.y;
        const preferred = Math.abs(dx) > Math.abs(dy)
          ? (dx < 0 ? DIR.LEFT : DIR.RIGHT)
          : (dy < 0 ? DIR.UP : DIR.DOWN);
        if (use_opts.includes(preferred)) { chosen_dir = preferred; }
      }
      e.dir = chosen_dir || (use_opts.length ? Phaser.Math.RND.pick(use_opts) : Phaser.Math.RND.pick([DIR.LEFT, DIR.RIGHT, DIR.UP, DIR.DOWN]));
      if (e.dir === DIR.NONE) { e.dir = Phaser.Math.RND.pick([DIR.LEFT, DIR.RIGHT, DIR.UP, DIR.DOWN]); }
    }

    // Enemy firing
    e.fireTimer -= dt * 1000;
    if (e.fireTimer <= 0) {
      e.fireTimer = Phaser.Math.Between(2500, 6000);
      if (this.player && e.type !== 'wizard') this.spawnEnemyBullet(e);
    }
  }

  isCentered(e) {
    const cx = e.gridCol * CELL + CELL/2;
    const cy = e.gridRow * CELL + CELL/2;
    return Math.abs(e.x - cx) < 2 && Math.abs(e.y - cy) < 2;
  }

  canMove(c, r, dir) {
    const d = DVEC[dir];
    const nc = c + d.x, nr = r + d.y;
    if (nr >= 0 && nr < ROWS && (nc < 0 || nc >= COLS)) return [(ROWS/2-1)|0, (ROWS/2)|0].includes(nr);
    return !isWall(this.maze, nc, nr);
  }

  validDirs(c, r) {
    const out = [];
    [DIR.LEFT, DIR.RIGHT, DIR.UP, DIR.DOWN].forEach(d => {
      if (this.canMove(c, r, d)) out.push(d);
    });
    return out;
  }

  opposite(d) {
    return { [DIR.LEFT]: DIR.RIGHT, [DIR.RIGHT]: DIR.LEFT, [DIR.UP]: DIR.DOWN, [DIR.DOWN]: DIR.UP, [DIR.NONE]: DIR.NONE }[d];
  }

  findOpenCell(maze, c, r) {
    return findOpenCell(maze, c, r);
  }

  spawnEntity(key, x, y, props) {
    const img = this.add.image(x, y, key);
    img.setDisplaySize(CELL - 6, CELL - 6);
    Object.assign(img, props);
    img.gridCol = Math.floor(x / CELL);
    img.gridRow = Math.floor(y / CELL);
    img.moveCooldown = 0;
    this.entityLayer.add(img);
    return img;
  }

  spawnEnemy(type, x, y) {
    const cfg = {
      burwor: { speed: 55, visible: 1, points: 100 },
      garwor: { speed: 75, visible: 0.6, points: 200, fades: true },
      thorwor: { speed: 95, visible: 0, points: 500, invisible: true },
      worluk: { speed: 140, visible: 1, points: 1000, flees: true },
      wizard: { speed: 90, visible: 1, points: 2500, teleports: true }
    }[type];

    const fleeRight = type === 'worluk' ? (x < MAZE_W/2) : false;
    const e = this.spawnEntity(type, x, y, {
      type, alive: true,
      baseSpeed: cfg.speed,
      speed: cfg.speed,
      dir: Phaser.Math.RND.pick([DIR.LEFT, DIR.RIGHT, DIR.UP, DIR.DOWN]),
      points: cfg.points,
      fades: cfg.fades || false,
      invisible: cfg.invisible || false,
      flees: cfg.flees || false,
      teleports: cfg.teleports || false,
      fireTimer: Phaser.Math.Between(2000, 6000),
      teleportTimer: type === 'wizard' ? Phaser.Math.Between(3000, 5000) : 0,
      escapeTimer: type === 'worluk' ? 1200 : 0,
      fleeRight
    });

    e._isTopView = (type === 'burwor' || type === 'garwor' || type === 'thorwor' || type === 'worluk');

    // Arcade colors (matching original)
    const arcadeColors = {
      burwor:  0x2244cc, // Blue wolf
      garwor:  0xddaa00, // Yellow T-rex
      thorwor: 0xcc2222, // Red scorpion
      worluk:  0xddaa00, // Yellow insect
      wizard:  0x2244cc  // Blue wizard
    };

    // Glow halo matching arcade colors
    const halo = this.add.circle(x, y, CELL * 0.45, arcadeColors[type] || 0xffffff, 0.22);
    this.entityLayer.add(halo);
    halo.setDepth(e.depth - 1);
    e._halo = halo;

    if (type === 'worluk') { e.dir = fleeRight ? DIR.RIGHT : DIR.LEFT; playWorlukSound(); this.playK('snd_warp'); }
    if (type === 'wizard') { playWizardTaunt(); speakRobotic("You better hope you don't find me, the Wizard of Wor!"); this.playK('snd_wizard_teleport'); }

    // Thorwor: fully invisible in maze (only visible on radar)
    if (cfg.invisible) e.setAlpha(0);
    else if (cfg.fades) e.setAlpha(cfg.visible);

    this.enemies.push(e);
    return e;
  }

  clearAll() {
    this.entityLayer.removeAll(true);
    this.bullets = []; this.enemyBullets = []; this.enemies = [];
    this.player = null;
    this.worlukSpawned = false; this.wizardSpawned = false;
    this.dungeonStartTime = 0;
    this.backupActive = false; this.backupTimer = 0;
    if (this.backupGroup) { this.backupGroup.destroy(); this.backupGroup = null; }
  }

  drawMaze() {
    const g = this.mazeGfx;
    g.clear();

    // Floor (dark)
    g.fillStyle(0x0a0a1a, 1);
    g.fillRect(0, 0, MAZE_W, MAZE_H);

    // Walls (bright with glow)
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (this.maze[r][c] === 1) {
          // Wall with neon glow
          g.fillStyle(0x1122aa, 1);
          g.fillRect(c * CELL, r * CELL, CELL, CELL);
          // Inner wall detail
          g.fillStyle(0x2244cc, 1);
          g.fillRect(c * CELL + 3, r * CELL + 3, CELL - 6, CELL - 6);
          // Corner highlights
          g.fillStyle(0x4466ff, 1);
          g.fillRect(c * CELL + 3, r * CELL + 3, 3, 3);
          g.fillRect(c * CELL + CELL - 6, r * CELL + 3, 3, 3);
          g.fillRect(c * CELL + 3, r * CELL + CELL - 6, 3, 3);
          g.fillRect(c * CELL + CELL - 6, r * CELL + CELL - 6, 3, 3);
        }
      }
    }

    // Warp tunnels (purple glow)
    const midR1 = (ROWS/2-1)|0, midR2 = (ROWS/2)|0;
    [midR1, midR2].forEach(r => {
      g.fillStyle(0xff00ff, 1);
      g.fillRect(0, r * CELL, CELL, CELL);
      g.fillStyle(0xff44ff, 1);
      g.fillRect(CELL - 3, r * CELL, 3, CELL);
      g.fillStyle(0xff44ff, 1);
      g.fillRect(MAZE_W - CELL, r * CELL, 3, CELL);
    });
  }

  drawRadar() {
    const g = this.radarGfx;
    g.clear();
    const y0 = MAZE_H;
    g.fillStyle(0x0a0a1a, 1);
    g.fillRect(0, y0, MAZE_W, RADAR_H);
    g.lineStyle(2, 0x00ff88, 0.7);
    g.strokeRect(8, y0 + 8, MAZE_W - 16, RADAR_H - 16);

    if (!this._radarTxt) {
      this._radarTxt = this.add.text(14, y0 + 10, 'RADAR', { fontFamily: 'Press Start 2P', fontSize: '10px', color: '#00ff88' });
    }

    const ix = 16, iy = y0 + 20;
    const iw = MAZE_W - 32, ih = RADAR_H - 30;
    const sx = iw / MAZE_W, sy = ih / MAZE_H;

    // Grid overlay
    g.lineStyle(1, 0x1a2a3a, 0.5);
    for (let r = 0; r <= ROWS; r++) {
      g.lineBetween(ix, iy + r * (ih / ROWS), ix + iw, iy + r * (ih / ROWS));
    }
    for (let c = 0; c <= COLS; c++) {
      g.lineBetween(ix + c * (iw / COLS), iy, ix + c * (iw / COLS), iy + ih);
    }

    // Player on radar (yellow dot)
    if (this.player && this.player.alive) {
      g.fillStyle(0xffea00, 1);
      g.fillRect(ix + this.player.x * sx - 3, iy + this.player.y * sy - 3, 6, 6);
    }

    // Enemies on radar (colored per type — matches arcade)
    this.enemies.forEach(e => {
      if (!e.alive) return;
      const cm = {
        burwor: 0x2244cc, // Blue square
        garwor: 0xddaa00, // Yellow square
        thorwor: 0xcc2222, // Red square
        worluk: 0xddaa00, // Yellow square
        wizard: 0xff00ff  // Purple square
      };
      g.fillStyle(cm[e.type] || 0xffffff, 1);
      g.fillRect(ix + e.x * sx - 3, iy + e.y * sy - 3, 6, 6);
    });

    // Backup warrior on radar (white)
    if (this.backupActive && this.backupGroup) {
      g.fillStyle(0xffffff, 1);
      g.fillRect(ix + this.backupX * sx - 3, iy + this.backupY * sy - 3, 6, 6);
    }

    // Radar sweep line
    this.radarSweepAngle = (this.radarSweepAngle || 0) + 0.04;
    const rcx = ix + iw / 2;
    const rcy = iy + ih / 2;
    const radius = Math.max(iw, ih) / 2;
    g.lineStyle(2, 0x00ff88, 0.35);
    g.lineBetween(rcx, rcy, rcx + Math.cos(this.radarSweepAngle) * radius, rcy + Math.sin(this.radarSweepAngle) * radius);
  }

  tryFire(dirOverride) {
    if (this.state !== 'playing' || !this.player || !this.player.alive) return;
    // Single-shot rule (arcade accurate)
    this.bullets.forEach(b => b.destroy()); this.bullets = [];

    const d = dirOverride || (this.player.dir === DIR.NONE ? (this.player.queuedDir || DIR.RIGHT) : this.player.dir);
    const vec = DVEC[d];
    if (!vec || (vec.x === 0 && vec.y === 0)) return;

    const b = this.add.image(this.player.x + vec.x * 16, this.player.y + vec.y * 16, 'bullet');
    b.vx = vec.x * 400; b.vy = vec.y * 400;
    if (vec.y !== 0) b.angle = 90;
    this.entityLayer.add(b); this.bullets.push(b);

    playShootSound();
  }

  spawnEnemyBullet(e) {
    const vec = DVEC[e.dir];
    if (vec.x === 0 && vec.y === 0) return;
    const b = this.add.image(e.x + vec.x * 16, e.y + vec.y * 16, 'ebullet');
    b.vx = vec.x * 260; b.vy = vec.y * 260;
    if (vec.y !== 0) b.angle = 90;
    this.entityLayer.add(b); this.enemyBullets.push(b);
    playEnemyShootSound();
  }

  handleBulletCollisions() {
    for (let i = this.bullets.length - 1; i >= 0; i--) {
      const b = this.bullets[i];
      let hit = false;

      for (const e of this.enemies) {
        if (!e.alive) continue;
        if (Phaser.Math.Distance.Between(b.x, b.y, e.x, e.y) < 22) {
          // Double score: if Worluk was killed on a level that spawned him
          const isDoubleScore = this.worlukSpawned && !this.wizardSpawned;
          const pointsAwarded = (isDoubleScore && e.type === 'worluk') ? (e.points * 2) : e.points;
          this.score += pointsAwarded;
          this.updateHUD();
          this.explodeAt(e.x, e.y, pointsAwarded);

          // Double score banner
          if (isDoubleScore && e.type === 'worluk') {
            const doubleTxt = this.add.text(MAZE_W/2, MAZE_H/2 - 50, 'DOUBLE SCORE BONUS!', {
              fontFamily: 'Press Start 2P', fontSize: '18px', color: '#ffea00'
            }).setOrigin(0.5).setDepth(200);
            this.tweens.add({ targets: doubleTxt, scale: 1.4, alpha: 0, duration: 1500, onComplete: () => doubleTxt.destroy() });
          }

          e.alive = false;
          if (e._halo) { e._halo.destroy(); e._halo = null; }
          e.destroy();
          hit = true; break;
        }
      }

      if (!hit) {
        for (let j = this.enemyBullets.length - 1; j >= 0; j--) {
          const eb = this.enemyBullets[j];
          if (Phaser.Math.Distance.Between(b.x, b.y, eb.x, eb.y) < 12) {
            eb.destroy(); this.enemyBullets.splice(j, 1); hit = true; break;
          }
        }
      }

      if (hit) { b.destroy(); this.bullets.splice(i, 1); }
    }
  }

  explodeAt(x, y, points) {
    // Floating points popup
    if (points) {
      const txt = this.add.text(x, y - 16, '+' + points, { fontFamily: 'Press Start 2P', fontSize: '11px', color: '#ffea00' });
      txt.setOrigin(0.5); txt.setDepth(100);
      this.tweens.add({ targets: txt, y: y - 48, alpha: 0, duration: 650, onComplete: () => txt.destroy() });
    }

    // Explosion animation (pixel art)
    const exp = this.add.image(x, y, 'explosion');
    exp.setDisplaySize(CELL, CELL);
    this.entityLayer.add(exp);
    this.tweens.add({
      targets: exp, scale: 0, alpha: 0, duration: 400,
      onComplete: () => exp.destroy()
    });

    playExplosionSound();
  }

  killPlayer() {
    if (this.state !== 'playing') return;
    this.state = 'dying';
    this.explodeAt(this.player.x, this.player.y);
    playHurtSound();
    this.player.alive = false;
    this.player.setVisible(false);
    this.lives--;
    this.updateHUD();

    // Backup warrior mechanic (arcade accurate)
    const safe = this.findOpenCell(this.maze, (COLS/2)|0, ROWS-3) || { c: 1, r: (ROWS/2)|0 };
    const px = safe.c * CELL + CELL/2;
    const py = safe.r * CELL + CELL/2;
    this.backupX = px; this.backupY = py;
    this.backupActive = true;
    this.backupTimer = 10000; // 10 seconds

    // Draw backup box
    if (this.backupGroup) this.backupGroup.destroy();
    this.backupGroup = this.add.container(px, py).setDepth(15);
    const box = this.add.image(0, 0, 'backup').setDisplaySize(CELL, CELL);
    this.backupGroup.add(box);
    const timerTxt = this.add.text(0, 0, '10', { fontFamily: 'Press Start 2P', fontSize: '10px', color: '#ffaa00' })
      .setOrigin(0.5);
    this.backupGroup.add(timerTxt);

    // Glow
    const glow = this.add.circle(0, 0, CELL * 0.5, 0xffaa00, 0.3);
    this.backupGroup.add(glow);

    this.time.delayedCall(900, () => {
      if (this.lives < 0) { this.gameOver(); return; }
      // Player respawns from backup
      this.player.x = px; this.player.y = py;
      this.player.gridCol = safe.c; this.player.gridRow = safe.r;
      this.player.dir = DIR.NONE; this.player.queuedDir = DIR.NONE;
      this.queuedDir = DIR.NONE;
      this.player.setVisible(true);
      this.player.alive = true;
      this.state = 'playing';
      this.backupActive = false;
      if (this.backupGroup) { this.backupGroup.destroy(); this.backupGroup = null; }
    });
  }

  nextLevel() {
    if (this.state !== 'playing') return;
    this.state = 'levelEnd';
    this.playK('snd_dungeon_clear');

    const overlay = this.add.container(0, 0).setDepth(200);
    const bg = this.add.rectangle(MAZE_W/2, MAZE_H/2, MAZE_W, MAZE_H, 0x000000, 0.85);
    overlay.add(bg);

    const isDoubleScore = this.worlukSpawned && !this.wizardSpawned;
    const levelName = (this.level === 6) ? 'THE ARENA' : (this.level >= 13 && (this.level - 13) % 6 === 0 ? 'THE PIT' : 'DUNGEON ' + this.level);

    let txt = this.add.text(MAZE_W/2, MAZE_H/2, levelName + (isDoubleScore ? '\nDOUBLE SCORE!' : ''), {
      fontFamily: 'Press Start 2P', fontSize: '16px', color: isDoubleScore ? '#ffea00' : '#00ff88',
      align: 'center', lineSpacing: 14
    }).setOrigin(0.5);
    overlay.add(txt);

    this.tweens.add({ targets: txt, scale: 1.4, duration: 2000, yoyo: true, repeat: 1 });

    this.time.delayedCall(3000, () => {
      overlay.destroy();
      this.level++;
      this.startLevel();
    });
  }

  gameOver() {
    if (this.state !== 'playing') return;
    this.state = 'gameover';
    this.playK('snd_gameover');

    document.getElementById('finalScore').textContent = 'SCORE: ' + this.score;
    document.getElementById('finalLevel').textContent = 'DUNGEON: ' + this.level;
    document.getElementById('gameOverScreen').classList.remove('hidden');
  }

  updateHUD() {
    document.getElementById('score').textContent = this.score;
    document.getElementById('lives').textContent = this.lives;
    document.getElementById('level').textContent = this.level;
  }

  _begin() {
    document.getElementById('startScreen').classList.add('hidden');
    document.getElementById('gameOverScreen').classList.add('hidden');
    this.score = 0; this.lives = 3; this.level = 1;
    this.updateHUD();
    speakRobotic("WARRIOR! PREPARE FOR BATTLE!");
    this.startLevel();
  }

  startLevel() {
    this.clearAll();
    this.maze = generateMaze(this.level);
    this.drawMaze();

    // Play Dragnet theme (5-note opening)
    playDragnetTheme();

    const midR = (ROWS/2)|0;

    // Player spawn
    let pCol = (COLS/2)|0, pRow = ROWS-3;
    const pSafe = this.findOpenCell(this.maze, pCol, pRow);
    if (pSafe) { pCol = pSafe.c; pRow = pSafe.r; }
    const px = pCol * CELL + CELL/2, py = pRow * CELL + CELL/2;
    this.player = this.spawnEntity('player', px, py, { type: 'player', speed: 120, baseSpeed: 120, dir: DIR.NONE, alive: true });

    // Enemy spawning (max 6 on screen at once — arcade accurate)
    const enemyCount = Math.min(6 + this.level, 10);
    const types = [];
    for (let i = 0; i < enemyCount; i++) {
      const r = Math.random();
      if (this.level >= 3 && r < 0.2) types.push('thorwor');
      else if (this.level >= 2 && r < 0.45) types.push('garwor');
      else types.push('burwor');
    }

    // Canonical spawn positions (arcade accurate)
    const sp = [[2, 2], [2, 6], [2, 10], [2, 14], [2, 18], [4, 4], [4, 18], [midR, 2], [midR, COLS-3]];
    types.forEach((t, i) => {
      const p = sp[i % sp.length];
      const safe = this.findOpenCell(this.maze, p[1], p[0]);
      if (!safe) return;
      this.spawnEnemy(t, safe.c * CELL + CELL/2, safe.r * CELL + CELL/2);
    });

    this.worlukSpawned = false; this.wizardSpawned = false;
    this.state = 'playing';
  }
}

// ============================================================
// PHASER CONFIG + INIT
// ============================================================

const config = {
  type: Phaser.AUTO,
  parent: 'phaserWrap',
  width: GAME_W,
  height: GAME_H,
  backgroundColor: '#000',
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  scene: [GameScene]
};

const game = new Phaser.Game(config);

// ============================================================
// START SCREEN
// ============================================================

function startBegin() {
  document.getElementById('startScreen').classList.add('hidden');
  (function tryB(n) {
    if (window._gameScene && window._gameScene._begin) {
      window._gameScene._begin(); return;
    }
    if (n > 50) return;
    setTimeout(() => tryB(n + 1), 100);
  })(0);
}

</script>
